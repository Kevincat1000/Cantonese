<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- jQuery & Ripples -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px; 
      --mask-color: #e3bd28; 
    }

    body, html {
      margin: 0; padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      overflow-x: hidden;
    }

    body { padding-top: var(--header-h); }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      width: 100vw;
      height: 65vh; 
      margin-top: 100px; 
      border-bottom: 1px solid #dcd8ce;
    }

    .gallery-item {
      position: relative;
      display: block;
      height: 100%;
      text-decoration: none;
      overflow: hidden; /* 裁剪溢出的水纹 */
      border-right: 1px solid rgba(0,0,0,0.05); 
    }

    .item-info {
      position: absolute;
      top: -65px; 
      left: 20px;
      z-index: 20; /* 确保文字在水纹之上 */
      pointer-events: none; 
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 11px; 
      font-weight: 600;
      text-transform: uppercase;
      color: #000;
      margin-bottom: 4px;
    }

    .item-title {
      display: block;
      font-size: 16px; 
      color: #1a1a1a;
    }

    /* 核心修改：图片容器层 */
    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(1.1); 
      transition: filter 0.5s ease;
      position: relative;
    }

    /* 遮罩层修改：使用 pointer-events:none 确保不拦截鼠标 */
    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.5s ease;
      z-index: 2; /* 放在底层图片和 Canvas 之间，或者顶层 */
      pointer-events: none;
    }

    /* 当 Hover 时，显示彩色并隐藏遮罩 */
    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1.1); 
    }
    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    /* 强制控制 Ripples 生成的 Canvas */
    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 5; /* 确保水纹在最上层产生扭曲视觉 */
      pointer-events: none; /* 让鼠标穿透 Canvas */
      transition: opacity 0.3s ease;
    }

    .map-section { padding: 80px 0; text-align: center; }
    #diaspora-map { width: 50vw; height: 400px; background: #eee; margin: 0 auto; }

    @media (max-width: 768px) {
      .gallery-container { grid-template-columns: 1fr; height: auto; }
      .gallery-item { height: 300px; margin-bottom: 60px; }
    }
  </style>
</head>

<body>
  
  <main>
    <div class="gallery-container">
        <!-- Phase 01 -->
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
        </a>

        <!-- Phase 02 -->
        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1840s–1940s</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
        </a>

        <!-- Phase 03 -->
        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–1997</span>
                <span class="item-title">Reforms, Refugees, <br>and New Waves</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://s.hdnux.com/photos/50/60/05/10682743/4/1920x0.jpg');"></div>
        </a>

        <!-- Phase 04 -->
        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 2000s–Present</span>
                <span class="item-title">Diversification and <br>Cultural Resilience</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://cdn.crowdriff.com/in-use/058b1d66-9cc0-d505-0b55-e3543a3c5c89/1080.jpg');"></div>
        </a>
    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>
  </main>

  <script>
    $(document).ready(function() {
        const $wrappers = $('.image-wrapper');

        // 1. 初始化 Ripples：关键是高 perturbance
        $wrappers.ripples({
            resolution: 512,
            dropRadius: 35,
            perturbance: 0.15, // 大幅提高扭曲度，让底图“晃”起来
            interactive: false
        });

        // 默认让 Canvas 透明，离开时好控制
        $('canvas').css('opacity', 0);

        $('.gallery-item').on('mouseenter', function(e) {
            const $target = $(this).find('.image-wrapper');
            
            // 立即显示并播放当前图片的水纹
            $target.find('canvas').css('opacity', 1);
            $target.ripples('play');

            // 进入时给一个初始冲击
            const offset = $target.offset();
            $target.ripples('drop', e.pageX - offset.left, e.pageY - offset.top, 50, 0.15);
        });

        $('.gallery-item').on('mousemove', function(e) {
            const $target = $(this).find('.image-wrapper');
            const offset = $target.offset();
            
            // 手动触发水纹：当前鼠标位置
            $target.ripples('drop', e.pageX - offset.left, e.pageY - offset.top, 30, 0.06);
        });

        $('.gallery-item').on('mouseleave', function() {
            const $target = $(this).find('.image-wrapper');
            
            // 关键：离开后立即淡出 Canvas 并暂停
            $target.find('canvas').css('opacity', 0);
            
            // 延迟一点点彻底停止，防止视觉上太突兀，但能确保切到下一张时本张已静止
            setTimeout(() => {
                $target.ripples('pause');
            }, 300);
        });
    });
  </script>
</body>
</html>
