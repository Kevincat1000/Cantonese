<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      width: 100%;
      overflow-x: hidden;
    }

    /* --- Header Style (配合 JS 隐藏) --- */
    /* 假设 header.js 注入的标签是 <header> */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 100;
    }
    header.hide {
      transform: translateY(-100%);
    }

    /* --- Main Layout --- */
    main {
      width: 100%;
      min-height: 100vh;
      display: block; /* 取消 Flex 垂直居中，改用 Padding 控制位置 */
      /* 
         关键调整：
         使用 padding-top 将内容顶下来。
         22vh 大约会让图片顶部位于屏幕 1/3 处，
         整体视觉重心会落在屏幕下方 0.618 - 0.7 的位置。
      */
      padding-top: 22vh; 
      padding-bottom: 100px;
    }

    /* --- Gallery Section --- */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      gap: 25px; 
      padding: 0 40px; 
      
      width: 100%;
      height: 55vh; /* 图片保持较高的高度 */
      min-height: 400px;
      
      position: relative;
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
    }

    /* 
       Item Info - 恢复最早版本排版
    */
    .item-info {
      position: absolute;
      /* 放在图片上方，因为 main 有 huge padding-top，这里绝对不会被遮挡 */
      top: -90px; 
      left: 0; 
      width: 100%;
      text-align: left; /* 恢复左对齐 */
      z-index: 10;
      pointer-events: none; 
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 13px; /* 恢复清晰的大小 */
      font-weight: 700; /* 恢复粗体 */
      letter-spacing: 0.5px;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 22px; /* 恢复较大的标题字号 */
      line-height: 1.25;
      font-weight: 400;
      color: #1a1a1a;
    }

    /* Image Box */
    .image-container {
      width: 100%;
      height: 100%;
      overflow: hidden; 
      position: relative;
      border-right: 1px solid rgba(0,0,0,0.05);
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(1.1); 
      transition: filter 0.4s ease, transform 0.6s ease;
      position: relative;
      transform: scale(1.01); 
    }

    .first-image { background-position: left center !important; }

    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.6s ease;
    }

    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1) url(#liquid-filter);
      transform: scale(1.05); 
    }

    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    /* --- Migration Map Section --- */
    .map-section {
      width: 100%;
      margin-top: 120px; /* Map 距离 Gallery 远一点 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .map-title {
      margin-bottom: 25px;
      text-align: center;
      font-family: 'Exo', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #diaspora-map {
      width: 60vw; 
      height: 400px; 
      background-color: #e5e0d5; 
      border: 1px solid #dcd8ce;
    }

    .svg-filters {
      position: absolute;
      width: 0; height: 0;
      visibility: hidden;
    }

    /* --- Responsive Fixes --- */
    @media (max-width: 900px) {
      main { padding-top: 150px; } /* 平板上稍微靠上一点 */
      .gallery-container {
        grid-template-columns: repeat(2, 1fr);
        height: auto;
        gap: 50px;
      }
      .gallery-item { height: 40vh; margin-bottom: 30px; }
      .item-info { top: -80px; }
    }

    @media (max-width: 600px) {
      main { padding-top: 120px; }
      .gallery-container { 
        grid-template-columns: 1fr; 
        height: auto; 
        padding: 0 30px; 
        gap: 80px; 
      }
      .gallery-item { height: 350px; }
      .item-info { position: static; margin-bottom: 15px; }
    }
  </style>
</head>

<body>

  <svg class="svg-filters">
    <filter id="liquid-filter">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" />
    </filter>
  </svg>
  
  <main>
    <div class="gallery-container">
        
        <!-- Phase 01 -->
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper first-image" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
            </div>
        </a>

        <!-- Phase 02 -->
        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1848–1947</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
            </div>
        </a>

        <!-- Phase 03 -->
        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–2000</span>
              <span class="item-title">Reforms, Refugees, and<br>American Dream</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper" style="background-image: url('https://s.hdnux.com/photos/50/60/05/10682743/4/1920x0.jpg');"></div>
            </div>
        </a>

        <!-- Phase 04 -->
        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 2000–Present</span>
                <span class="item-title">Diversification and <br>Cultural Resilience</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper" style="background-image: url('https://cdn.crowdriff.com/in-use/058b1d66-9cc0-d505-0b55-e3543a3c5c89/1080.jpg');"></div>
            </div>
        </a>
    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>
  </main>

  <script>
    // --- 1. Water Ripple Effect ---
    const turb = document.getElementById('turbulence');
    let step = 0;
    let requestID = null;

    function animate() {
      step += 0.015; 
      const bfX = 0.02 + Math.cos(step) * 0.008;
      const bfY = 0.02 + Math.sin(step) * 0.01;
      turb.setAttribute('baseFrequency', `${bfX} ${bfY}`);
      requestID = requestAnimationFrame(animate);
    }

    const items = document.querySelectorAll('.gallery-item');
    items.forEach(item => {
      item.addEventListener('mouseenter', () => { if (!requestID) animate(); });
      item.addEventListener('mouseleave', () => {
        const isAnyHovered = Array.from(items).some(i => i.matches(':hover'));
        if (!isAnyHovered) { cancelAnimationFrame(requestID); requestID = null; }
      });
    });

    // --- 2. Header Hide Logic ---
    document.addEventListener("DOMContentLoaded", function() {
        let lastScrollY = window.scrollY;
        const header = document.querySelector('header'); // 确保你的 header.js 生成了 <header> 标签
        
        if (header) {
            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                if (currentScrollY > lastScrollY && currentScrollY > 50) {
                    header.classList.add('hide');
                } else {
                    header.classList.remove('hide');
                }
                lastScrollY = currentScrollY;
            });
        }
    });
  </script>
</body>
</html>
