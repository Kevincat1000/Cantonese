<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>
  <script src="./assets/mapbox.js" defer></script>

  <style>
    :root {
      --bg: #f5f0e5;
      --text: #1a1a1a;
      --mask-color: #e3bd28;
      --header-h: 48px;
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    /* Header CSS (保持原样，不修改 header 相关) */
    header {
      position: fixed !important;
      top: 0; left: 0; width: 100%;
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
      background-color: var(--bg);
    }
    header.hide { transform: translateY(-100%) !important; }
    #header-injection-point {
      display: none !important;
    }

    main {
      width: 100%;
      min-height: 100vh;
      display: block;
      padding-top: calc(var(--header-h) + 12vh);
      padding-bottom: 100px;
    }

    /* --- PC 端默认布局 --- */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      padding: 0 40px;
      width: 100%;
      height: 55vh; 
      min-height: 400px;
      position: relative;
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%; /* PC端继承父元素高度 */
      text-decoration: none;
      cursor: pointer;
    }

    .item-info {
      position: absolute; /* PC端绝对定位，悬浮在图片上方 */
      bottom: 100%; 
      left: 0; width: 100%;
      padding-bottom: 15px; 
      text-align: left;
      z-index: 10;
      pointer-events: none;
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 400;
      color: #1a1a1a;
    }

    .image-container {
      width: 100%;
      height: 100%; /* PC端占满容器 */
      overflow: hidden;
      position: relative;
      border-right: 1px solid rgba(0,0,0,0.05);
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      /* PC端默认滤镜 */
      filter: grayscale(100%) contrast(1.1);
      transition: filter 0.4s ease, transform 0.6s ease;
      position: relative;
      transform: scale(1.01);
    }
    .first-image { background-position: left center !important; }

    /* PC端黄色遮罩 */
    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply;
      opacity: 0.85;
      transition: opacity 0.6s ease;
    }

    /* PC端鼠标悬停效果 */
    @media (min-width: 601px) {
      .gallery-item:hover .image-wrapper {
        filter: grayscale(0%) contrast(1) url(#liquid-filter);
        transform: scale(1.05);
      }
      .gallery-item:hover .image-wrapper::after { opacity: 0; }
    }

    /* --- 地图区域 --- */
    .map-section {
      width: 100%;
      margin-top: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      scroll-margin-top: 100px;
    }

    .map-title {
      margin-bottom: 25px;
      text-align: center;
      font-family: 'Exo', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #000;
      text-transform: uppercase;
    }

    #diaspora-map {
      width: 60vw;
      height: 400px;
      background-color: #e5e0d5;
      border: 1px solid #dcd8ce;
    }

    .svg-filters { position: absolute; width: 0; height: 0; visibility: hidden; }

    /* --- 滚动箭头 --- */
    .scroll-arrow-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .scroll-arrow-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-arrow-svg {
      width: 14px;
      height: 30px;
      display: block;
      animation: float 2s ease-in-out infinite;
    }

    .arrow-path {
      fill: none;
      stroke: #000;
      stroke-width: 1.5px;
      stroke-linecap: square;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    .scroll-arrow-container:hover .scroll-arrow-svg { animation-play-state: paused; }

    /* --- 响应式适配 --- */
    
    /* 平板尺寸 */
    @media (max-width: 900px) {
      main { padding-top: calc(var(--header-h) + 8vh); }
      .gallery-container { grid-template-columns: repeat(2, 1fr); height: auto; gap: 50px; }
      .gallery-item { height: 40vh; margin-bottom: 40px; }
      #diaspora-map { width: 90vw; }
    }

    /* 手机尺寸 (重点修改部分) */
    @media (max-width: 600px) {
      main { padding-top: calc(var(--header-h) + 6vh); }
      
      .gallery-container { 
        grid-template-columns: 1fr; 
        height: auto; 
        padding: 0 30px; 
        gap: 60px; /* 增加间距 */
      }
      
      /* 修复 1：容器不再固定高度，改为 flex 布局，高度由内容撑开 */
      .gallery-item { 
        height: auto; 
        display: flex;
        flex-direction: column; /* 垂直排列：上文字，下图片 */
        margin-bottom: 0; /* 这里的间距由父容器 gap 控制 */
      }
      
      /* 修复 2：文字部分取消绝对定位，回归正常文档流 */
      .item-info { 
        position: static; 
        width: 100%;
        margin-bottom: 12px; /* 文字和图片之间的间距 */
        pointer-events: auto;
      }

      /* 字体增大 */
      .item-number { font-size: 16px; margin-bottom: 4px; }
      .item-title { font-size: 20px; line-height: 1.4; }
      .map-title { font-size: 16px; }

      /* 修复 3：图片容器改为固定像素高度，不再是 100% */
      .image-container {
        width: 100%;
        height: 250px; /* 给定一个合理的高度 */
        flex-shrink: 0; /* 防止被挤压 */
      }

      /* 去除特效 */
      .image-wrapper {
        filter: none;
        transform: none;
      }
      
      /* 隐藏遮罩 */
      .image-wrapper::after {
        display: none;
        content: none;
      }

      /* 禁止 hover */
      .gallery-item:hover .image-wrapper {
        filter: none;
        transform: none;
      }
    }

    html.preload body { opacity: 0; }
    body { transition: opacity .15s ease; }
  </style>
</head>

<body>

  <div id="header-injection-point"></div>

  <svg class="svg-filters">
    <filter id="liquid-filter">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" />
    </filter>
  </svg>

  <main>
    <div class="gallery-container">
      <a href="phase1.html" class="gallery-item">
        <div class="item-info">
          <span class="item-number">01. 17th–19th Centuries</span>
          <span class="item-title">Early Migration within <br>Southeast Asia</span>
        </div>
        <div class="image-container">
          <div class="image-wrapper first-image" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
        </div>
      </a>

      <a href="phase2.html" class="gallery-item">
        <div class="item-info">
          <span class="item-number">02. 1848–1947</span>
          <span class="item-title">Building North America <br>& The Pacific</span>
        </div>
        <div class="image-container">
          <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
        </div>
      </a>

      <a href="phase3.html" class="gallery-item">
        <div class="item-info">
          <span class="item-number">03. 1965–2000</span>
          <span class="item-title">Reforms, Refugees, and<br>American Dream</span>
        </div>
        <div class="image-container">
          <div class="image-wrapper" style="background-image: url('https://s.hdnux.com/photos/50/60/05/10682743/4/1920x0.jpg');"></div>
        </div>
      </a>

      <a href="phase4.html" class="gallery-item">
        <div class="item-info">
          <span class="item-number">04. 2000–Present</span>
          <span class="item-title">Diversification and <br>Cultural Resilience</span>
        </div>
        <div class="image-container">
          <div class="image-wrapper" style="background-image: url('https://cdn.crowdriff.com/in-use/058b1d66-9cc0-d505-0b55-e3543a3c5c89/1080.jpg');"></div>
        </div>
      </a>
    </div>

    <div class="scroll-arrow-container" id="scrollArrow">
      <svg class="scroll-arrow-svg" viewBox="0 0 14 30" preserveAspectRatio="none">
        <line x1="7" y1="0" x2="7" y2="28" class="arrow-path" />
        <line x1="7" y1="28" x2="1" y2="20" class="arrow-path" />
        <line x1="7" y1="28" x2="13" y2="20" class="arrow-path" />
      </svg>
    </div>

    <div class="map-section" id="mapSection">
      <div class="map-title">Migration map</div>
      <div id="diaspora-map"></div>
    </div>
  </main>

  <script>
    (function () {
      function syncHeaderHeight() {
        const header = document.querySelector('header') || document.querySelector('.site-header');
        if (!header) return false;

        const h = Math.ceil(header.getBoundingClientRect().height);
        if (h > 0) {
          document.documentElement.style.setProperty('--header-h', h + 'px');
          return true;
        }
        return false;
      }

      function markReady() {
        document.body.classList.add('header-ready');
        document.documentElement.classList.remove('preload');
      }

      document.addEventListener('DOMContentLoaded', () => {
        let tries = 0;
        (function waitHeader() {
          tries++;
          if (syncHeaderHeight()) { markReady(); return; }
          if (tries > 60) { markReady(); return; }
          requestAnimationFrame(waitHeader);
        })();

        window.addEventListener('load', () => syncHeaderHeight(), { once: true });
      });
    })();

    const turb = document.getElementById('turbulence');
    let step = 0;
    let requestID = null;

    function animate() {
      step += 0.015;
      const bfX = 0.02 + Math.cos(step) * 0.008;
      const bfY = 0.02 + Math.sin(step) * 0.01;
      turb.setAttribute('baseFrequency', `${bfX} ${bfY}`);
      requestID = requestAnimationFrame(animate);
    }

    const items = document.querySelectorAll('.gallery-item');
    items.forEach(item => {
      item.addEventListener('mouseenter', () => { if (!requestID) animate(); });
      item.addEventListener('mouseleave', () => {
        const isAnyHovered = Array.from(items).some(i => i.matches(':hover'));
        if (!isAnyHovered) { cancelAnimationFrame(requestID); requestID = null; }
      });
    });

    let lastScrollY = window.scrollY;
    const arrow = document.getElementById('scrollArrow');
    const mapSection = document.getElementById('mapSection');

    if (arrow && mapSection) {
        arrow.addEventListener('click', () => {
            mapSection.scrollIntoView({ behavior: 'smooth' });
        });
    }

    window.addEventListener('scroll', () => {
      if (!document.body.classList.contains('header-ready')) return;

      const header = document.querySelector('header') || document.querySelector('.site-header');
      const currentScrollY = window.scrollY;

      if (header) {
        if (currentScrollY > lastScrollY && currentScrollY > 50) {
          header.classList.add('hide');
        } else {
          header.classList.remove('hide');
        }
      }

      if (arrow) {
        if (currentScrollY > 200) {
          arrow.classList.add('fade-out');
        } else {
          arrow.classList.remove('fade-out');
        }
      }

      lastScrollY = currentScrollY;
    });
  </script>
</body>
</html>
