<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --mask-color: #e3bd28; 
      --header-height: 60px;
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      width: 100%;
      overflow-x: hidden;
    }

    /* 
       Header Container Style (配合 JS 隐藏) 
       假设 header.js 生成的 header 是 fixed 定位的 
    */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      transition: transform 0.4s ease-in-out;
      z-index: 100;
    }

    /* 当添加 .hide 类时隐藏 Header */
    header.hide {
      transform: translateY(-100%);
    }

    /* 
       Main Layout - Golden Ratio / Vertical Centering
       使用 Flexbox 将内容置于屏幕视觉中心
    */
    main {
      width: 100%;
      min-height: 100vh; /* 占满全屏高度 */
      display: flex;
      flex-direction: column;
      justify-content: center; /* 垂直居中 */
      padding-top: 40px; /* 稍微给顶部一点呼吸空间 */
    }

    /* --- Gallery Section --- */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      gap: 25px; 
      padding: 0 40px; 
      
      width: 100%;
      /* 设置高度为视口高度的 55%，符合黄金分割的视觉舒适区 */
      height: 55vh; 
      min-height: 380px;
      max-height: 600px;
      
      margin: 0 auto; /* 水平居中 */
      position: relative;
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
    }

    /* 
       Item Info - 回归小字体 & 优雅排版
    */
    .item-info {
      position: absolute;
      /* 将文字定位在图片上方，留出适当间距 */
      bottom: 100%; 
      left: 0;
      width: 100%; 
      text-align: center;
      z-index: 10;
      pointer-events: none; 
      padding-bottom: 20px; /* 文字和图片之间的留白 */
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 10px; /* 极小字体 */
      font-weight: 600;
      letter-spacing: 2px; /* 增加字间距，增加高级感 */
      color: #555; /* 颜色调浅 */
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 15px; /* 回归原来的小号字体 */
      line-height: 1.35;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.5px;
    }

    /* Image Box */
    .image-container {
      width: 100%;
      height: 100%;
      overflow: hidden; 
      position: relative;
      border: 1px solid rgba(0,0,0,0.08); /* 极细的边框增加精致感 */
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(1.05); 
      transition: filter 0.5s ease, transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      transform: scale(1.01); 
    }

    .first-image { background-position: left center !important; }

    /* 黄色遮罩层 */
    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.8; 
      transition: opacity 0.6s ease;
    }

    /* Hover Effects */
    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1) url(#liquid-filter);
      transform: scale(1.06); 
    }

    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    /* --- Migration Map Section --- */
    .map-section {
      width: 100%;
      /* 增加上间距，让 Map 和上面的 Gallery 稍微分开 */
      margin-top: 80px; 
      padding-bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .map-title {
      margin-bottom: 20px;
      text-align: center;
      font-family: 'Exo', sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #333;
    }

    #diaspora-map {
      width: 60vw; 
      height: 400px; 
      background-color: #e5e0d5; 
      border: 1px solid #dcd8ce;
    }

    /* SVG Hidden */
    .svg-filters {
      position: absolute;
      width: 0; height: 0;
      visibility: hidden;
    }

    /* --- Responsive Fixes --- */
    @media (max-width: 900px) {
      .gallery-container {
        grid-template-columns: repeat(2, 1fr);
        height: auto;
        gap: 60px; /* 平板上增加垂直间距 */
      }
      .gallery-item { height: 40vh; }
    }

    @media (max-width: 600px) {
      .gallery-container { 
        grid-template-columns: 1fr; 
        height: auto; 
        padding: 0 30px; 
        gap: 80px; /* 手机上图片间距拉大 */
      }
      .gallery-item { height: 350px; }
      .item-info { padding-bottom: 10px; }
    }
  </style>
</head>

<body>

  <!-- SVG Filter for Liquid Effect -->
  <svg class="svg-filters">
    <filter id="liquid-filter">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" />
    </filter>
  </svg>
  
  <main>
    <div class="gallery-container">
        
        <!-- Phase 01 -->
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper first-image" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
            </div>
        </a>

        <!-- Phase 02 -->
        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1848–1947</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
            </div>
        </a>

        <!-- Phase 03 -->
        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–2000</span>
              <span class="item-title">Reforms, Refugees, and<br>American Dream</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper" style="background-image: url('https://s.hdnux.com/photos/50/60/05/10682743/4/1920x0.jpg');"></div>
            </div>
        </a>

        <!-- Phase 04 -->
        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 2000–Present</span>
                <span class="item-title">Diversification and <br>Cultural Resilience</span>
            </div>
            <div class="image-container">
                <div class="image-wrapper" style="background-image: url('https://cdn.crowdriff.com/in-use/058b1d66-9cc0-d505-0b55-e3543a3c5c89/1080.jpg');"></div>
            </div>
        </a>
    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>
  </main>

  <!-- Scripts -->
  <script>
    // --- 1. Water Ripple Effect Logic ---
    const turb = document.getElementById('turbulence');
    let step = 0;
    let requestID = null;

    function animate() {
      step += 0.015; 
      const bfX = 0.02 + Math.cos(step) * 0.008;
      const bfY = 0.02 + Math.sin(step) * 0.01;
      turb.setAttribute('baseFrequency', `${bfX} ${bfY}`);
      requestID = requestAnimationFrame(animate);
    }

    const items = document.querySelectorAll('.gallery-item');
    items.forEach(item => {
      item.addEventListener('mouseenter', () => { if (!requestID) animate(); });
      item.addEventListener('mouseleave', () => {
        const isAnyHovered = Array.from(items).some(i => i.matches(':hover'));
        if (!isAnyHovered) { cancelAnimationFrame(requestID); requestID = null; }
      });
    });

    // --- 2. Header Scroll Logic (Hide on scroll down) ---
    // 等待页面加载完毕，确保 header 元素存在
    document.addEventListener("DOMContentLoaded", function() {
        let lastScrollY = window.scrollY;
        
        // 尝试获取 header，如果你是通过 header.js 注入的，可能需要给它一个特定的 ID 或 class
        // 这里假设 header 标签就是 <header>
        const header = document.querySelector('header') || document.querySelector('.site-header'); 

        if (header) {
            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                
                // 向下滚动超过 50px 且当前滚动位置大于上次位置 -> 隐藏
                if (currentScrollY > lastScrollY && currentScrollY > 50) {
                    header.classList.add('hide');
                } else {
                    // 向上滚动 -> 显示
                    header.classList.remove('hide');
                }
                lastScrollY = currentScrollY;
            });
        }
    });
  </script>
</body>
</html>
