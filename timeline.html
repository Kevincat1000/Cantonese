<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- jQuery & Ripples -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

  <!-- External Mapbox Logic -->
  <script src="./assets/mapbox.js" defer></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px; 
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      padding-top: var(--header-h);
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      width: 100vw;
      height: 65vh; 
      border-bottom: 1px solid #dcd8ce;
      margin-top: 100px; /* Gallery shifted down 100px */
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
      border-right: 1px solid rgba(0,0,0,0.05);
      background-color: var(--bg);
    }

    .item-info {
      position: absolute;
      top: -65px; /* Text shifted up 95px */
      left: 20px;
      z-index: 50; 
      pointer-events: none; 
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 11px; 
      font-weight: 600;
      letter-spacing: 1px;
      color: #000;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 16px; 
      line-height: 1.3;
      font-weight: 400;
      color: #1a1a1a;
      opacity: 0.9;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      /* Default state: grayscale and sharp */
      filter: grayscale(100%) contrast(1.1) blur(0px); 
      transition: filter 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
      z-index: 10;
    }

    .first-image {
      background-position: left center !important;
    }

    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.8s ease;
      z-index: 20;
      pointer-events: none;
    }

    /* Hover state: Remove grayscale, remove mask, and add BLUR for the ripple to "shake" */
    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1) blur(2px); 
    }

    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    .map-section {
      width: 100%;
      padding: 80px 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .map-title {
        margin-bottom: 20px;
        font-family: 'Exo', sans-serif;
        letter-spacing: 1px;
        font-size: 12px;
        text-transform: uppercase;
        color: #666;
    }

    #diaspora-map {
      width: 50vw; 
      height: 50vw; 
      max-height: 500px; 
      border: 1px solid #dcd8ce;
    }

    @media (max-width: 768px) {
      .gallery-container {
        grid-template-columns: 1fr; 
        height: auto;
        margin-top: 80px;
      }
      .item-info {
        top: -45px;
      }
      .gallery-item {
        height: 300px; 
        margin-bottom: 60px;
      }
    }
  </style>
</head>

<body>

        </a>
