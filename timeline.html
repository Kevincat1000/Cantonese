<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- jQuery & Ripples Dependency -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px;
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      padding-top: var(--header-h);
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      width: 95vw;
      margin: 100px auto 50px auto; 
    }

    .gallery-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    /* Caption moved above the image */
    .card-caption {
      margin-bottom: 12px;
      padding-right: 5px;
      min-height: 50px; /* Ensures alignment if text wraps */
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: #888;
      text-transform: uppercase;
    }

    .item-description {
      display: block;
      font-family: 'Lato', sans-serif;
      font-size: 11px; 
      line-height: 1.4;
      color: #333;
      font-weight: 400;
    }

    .gallery-item {
      position: relative;
      width: 100%;
      height: 45vh; 
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: all 0.6s ease;
      filter: grayscale(100%) contrast(1.1); 
    }

    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.8; 
      transition: opacity 0.6s ease;
    }

    .gallery-card:hover .image-wrapper {
      filter: grayscale(0%) contrast(1);
    }

    .gallery-card:hover .image-wrapper::after {
      opacity: 0;
    }

    .map-section {
      width: 100%;
      padding: 60px 0 100px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .map-title {
        margin-bottom: 30px;
        font-family: 'Exo', sans-serif;
        letter-spacing: 2px;
        font-size: 14px;
        text-transform: uppercase;
        color: #1a1a1a;
        font-weight: 600;
    }

    #diaspora-map {
      width: 60vw; 
      height: 500px;
      background-color: #e5e0d5;
      border: 1px solid #dcd8ce;
    }

    @media (max-width: 768px) {
      .gallery-container {
        grid-template-columns: 1fr;
        margin-top: 50px;
      }
      .gallery-item {
        height: 300px;
      }
      .card-caption {
        min-height: auto;
      }
      #diaspora-map {
        width: 90vw;
        height: 350px;
      }
    }
  </style>
</head>

<body>
  
  <main>
    
    <div class="gallery-container">
        
        <!-- Phase 01 -->
        <a href="phase1.html" class="gallery-card">
            <div class="card-caption">
                <span class="item-number">Phase 01</span>
                <span class="item-description">17th–19th Centuries: Early Migration within Southeast Asia</span>
            </div>
            <div class="gallery-item">
                <div class="image-wrapper ripple-effect" style="background-image: url('https://vcdn1-giaitri.vnecdn.net/2024/07/27/cho-lon-5-3295-1722076620.jpg');"></div>
            </div>
        </a>

        <!-- Phase 02 -->
        <a href="phase2.html" class="gallery-card">
            <div class="card-caption">
                <span class="item-number">Phase 02</span>
                <span class="item-description">1840s–1940s: Building North America & The Pacific</span>
            </div>
            <div class="gallery-item">
                <div class="image-wrapper ripple-effect" style="background-image: url('https://assets.libsyn.com/show/311006/Chinese_Gold_Miners_b.jpg');"></div>
            </div>
        </a>

        <!-- Phase 03 -->
        <a href="phase3.html" class="gallery-card">
            <div class="card-caption">
                <span class="item-number">Phase 03</span>
                <span class="item-description">1965–1997: Reforms, Refugees, and New Waves</span>
            </div>
            <div class="gallery-item">
                <div class="image-wrapper ripple-effect" style="background-image: url('https://images.unsplash.com/photo-1548505224-b58603632f81?q=80&w=1200&auto=format&fit=crop');"></div>
            </div>
        </a>

        <!-- Phase 04 -->
        <a href="phase4.html" class="gallery-card">
            <div class="card-caption">
                <span class="item-number">Phase 04</span>
                <span class="item-description">2000s–Present: Diversification and Cultural Resilience</span>
            </div>
            <div class="gallery-item">
                <div class="image-wrapper ripple-effect" style="background-image: url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=1200&auto=format&fit=crop');"></div>
            </div>
        </a>

    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>

  </main>

  <script src="./assets/mapbox.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        try {
            $('.ripple-effect').ripples({
                resolution: 512,
                dropRadius: 20,
                perturbance: 0.04
            });
        } catch (e) {
            console.warn("Ripples effect failed to load.");
        }
    });
  </script>
</body>
</html>
