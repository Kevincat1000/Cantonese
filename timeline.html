<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px; 
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body { padding-top: var(--header-h); }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      width: 100vw;
      height: 65vh; 
      border-bottom: 1px solid #dcd8ce;
      margin-top: 100px; 
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
      /* 关键：隐藏内部因滤镜产生的溢出边缘 */
      overflow: hidden; 
      border-right: 1px solid rgba(0,0,0,0.05);
    }

    .item-info {
      position: absolute;
      top: -65px;
      left: 20px;
      z-index: 10;
      pointer-events: none; 
    }

    /* 统一的编号/标签样式 */
    .item-number, .map-title {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 11px; 
      font-weight: 600;
      letter-spacing: 1px;
      color: #000;
      text-transform: uppercase;
    }

    .item-number { margin-bottom: 4px; }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 16px; 
      line-height: 1.3;
      font-weight: 400;
      color: #1a1a1a;
      opacity: 0.9;
    }

    /* Image Wrapper */
    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(1.1); 
      transition: filter 0.4s ease, transform 0.6s ease;
      position: relative;
      /* 初始状态微调，确保放大后不露白 */
      transform: scale(1.01); 
    }

    .first-image { background-position: left center !important; }

    /* Overlay Mask */
    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.6s ease;
    }

    /* Hover State */
    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1) url(#liquid-filter);
      /* 关键：hover时稍微放大图片，让波动的锯齿边缘隐藏在容器外面 */
      transform: scale(1.15); 
    }

    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    /* Map Section Styles */
    .map-section {
      width: 100%;
      padding: 100px 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .map-title {
        margin-bottom: 25px;
        /* 继承了上面定义的 Exo 11px 样式 */
    }

    #diaspora-map {
      width: 50vw; 
      height: 50vw; 
      max-height: 500px; 
      background-color: #e5e0d5; 
      border: 1px solid #dcd8ce;
    }

    /* SVG Filter Definition */
    .svg-filters {
      position: absolute;
      width: 0; height: 0;
      visibility: hidden;
    }

    @media (max-width: 768px) {
      .gallery-container { grid-template-columns: 1fr; height: auto; margin-top: 80px; }
      .gallery-item { height: 300px; margin-bottom: 80px; border-right: none; }
      #diaspora-map { width: 90vw; height: 300px; }
    }
  </style>
</head>

<body>

  <!-- SVG Turbulent Filter -->
  <svg class="svg-filters">
    <filter id="liquid-filter">
      <!-- baseFrequency 决定水纹的精细度，numOctaves 增加层次感 -->
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <!-- scale 决定波浪的大小 -->
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" />
    </filter>
  </svg>
  
  <main>
    <div class="gallery-container">
        
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-wrapper first-image" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
        </a>

        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1840s–1940s</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
        </a>

        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–1997</span>
                <span class="item-title">Reforms, Refugees, <br>and New Waves</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://s.hdnux.com/photos/50/60/05/10682743/4/1920x0.jpg');"></div>
        </a>

        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 2000s–Present</span>
                <span class="item-title">Diversification and <br>Cultural Resilience</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://cdn.crowdriff.com/in-use/058b1d66-9cc0-d505-0b55-e3543a3c5c89/1080.jpg');"></div>
        </a>

    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>

  </main>

  <script>
    const turb = document.getElementById('turbulence');
    let step = 0;
    let requestID = null;

    function animate() {
      // 增加 step 的步进（从 0.005 增加到 0.02），使波动变快
      step += 0.015; 
      
      // 动态改变频率值，模拟急促的水流
      const bfX = 0.02 + Math.cos(step) * 0.01;
      const bfY = 0.02 + Math.sin(step) * 0.01;
      
      turb.setAttribute('baseFrequency', `${bfX} ${bfY}`);
      requestID = requestAnimationFrame(animate);
    }

    const items = document.querySelectorAll('.gallery-item');
    
    items.forEach(item => {
      item.addEventListener('mouseenter', () => {
        if (!requestID) animate();
      });
      
      item.addEventListener('mouseleave', () => {
        const isAnyHovered = Array.from(items).some(i => i.matches(':hover'));
        if (!isAnyHovered) {
          cancelAnimationFrame(requestID);
          requestID = null;
        }
      });
    });
  </script>
</body>
</html>
