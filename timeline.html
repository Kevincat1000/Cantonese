<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Header/Footer Injectors (保持不变) -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <!-- Mapbox -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- jQuery & Ripples -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px; 
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0; padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body { padding-top: var(--header-h); }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      width: 100vw;
      height: 65vh; 
      border-bottom: 1px solid #dcd8ce;
      margin-top: 100px; 
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      /* 注意：这里不能写 overflow: hidden，否则 01-04 的字会消失 */
    }

    /* 文字信息层 */
    .item-info {
      position: absolute;
      top: -65px; 
      left: 20px;
      z-index: 100; /* 确保文字在最顶层 */
      pointer-events: none; 
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 11px; 
      font-weight: 600;
      letter-spacing: 1px;
      color: #000;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 16px; 
      line-height: 1.3;
      font-weight: 400;
      color: #1a1a1a;
      opacity: 0.9;
    }

    /* 图片包裹容器：执行水纹效果的层 */
    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: filter 0.6s ease;
      filter: grayscale(100%) contrast(1.1); 
      overflow: hidden; /* 这里控制水纹不漏出来 */
      position: relative;
    }

    /* 遮罩颜色层 */
    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.6s ease;
      pointer-events: none;
      z-index: 1; 
    }

    /* Hover 状态：颜色恢复，遮罩消失 */
    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1); 
    }
    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    /* Canvas 强制置顶以产生扭曲感 */
    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 2; /* 在遮罩层之上 */
      pointer-events: none;
    }

    .map-section { width: 100%; padding: 80px 0; display: flex; flex-direction: column; align-items: center; }
    #diaspora-map { width: 50vw; height: 500px; background-color: #e5e0d5; border: 1px solid #dcd8ce; }

    @media (max-width: 768px) {
      .gallery-container { grid-template-columns: 1fr; height: auto; margin-top: 80px; }
      .gallery-item { height: 300px; margin-bottom: 80px; }
      .item-info { top: -50px; }
    }
  </style>
</head>

<body>
  
  <main>
    <div class="gallery-container">
        
        <!-- Phase 01 -->
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
        </a>

        <!-- Phase 02 -->
        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1840s–1940s</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
        </a>

        <!-- Phase 03 -->
        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–1997</span>
                <span class="item-title">Reforms, Refugees, <br>and New Waves</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://s.hdnux.com/photos/50/60/05/10682743/4/1920x0.jpg');"></div>
        </a>

        <!-- Phase 04 -->
        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 2000s–Present</span>
                <span class="item-title">Diversification and <br>Cultural Resilience</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://cdn.crowdriff.com/in-use/058b1d66-9cc0-d505-0b55-e3543a3c5c89/1080.jpg');"></div>
        </a>

    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>
  </main>

  <script>
    $(document).ready(function() {
        const $wrappers = $('.image-wrapper');

        // 初始化 Ripples
        $wrappers.ripples({
            resolution: 512,
            dropRadius: 35,
            perturbance: 0.12, // 确保这个值足够高，才能产生“底图晃动”的效果
            interactive: false // 关闭默认交互，由 JS 精确控制
        });

        $('.gallery-item').on('mouseenter', function(e) {
            const $wrapper = $(this).find('.image-wrapper');
            const offset = $wrapper.offset();
            
            // 开始播放当前图片的水纹
            $wrapper.ripples('play');
            
            // 鼠标进入位置产生一个大水纹
            $wrapper.ripples('drop', e.pageX - offset.left, e.pageY - offset.top, 50, 0.12);
        });

        $('.gallery-item').on('mousemove', function(e) {
            const $wrapper = $(this).find('.image-wrapper');
            const offset = $wrapper.offset();
            
            // 鼠标移动产生持续水纹
            $wrapper.ripples('drop', e.pageX - offset.left, e.pageY - offset.top, 25, 0.05);
        });

        $('.gallery-item').on('mouseleave', function() {
            const $wrapper = $(this).find('.image-wrapper');
            
            // 核心修复：一旦离开，立即暂停该图片的所有计算
            // 这样它就不会干扰其他正在被 hover 的图片
            $wrapper.ripples('pause');
        });

        // 窗口尺寸变化处理
        $(window).on('resize', function() {
            $wrappers.ripples('updateSize');
        });
    });
  </script>
</body>
</html>
