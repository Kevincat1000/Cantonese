<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- jQuery & Ripples -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

  <!-- External Mapbox Logic -->
  <script src="./assets/mapbox.js" defer></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px; 
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      padding-top: var(--header-h);
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      width: 100vw;
      height: 65vh; 
      border-bottom: 1px solid #dcd8ce;
      margin-top: 100px; 
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      /* Removed overflow:hidden to allow text to move up outside the box */
      text-decoration: none;
      cursor: pointer;
      border-right: 1px solid rgba(0,0,0,0.05); 
    }

    .item-info {
      position: absolute;
      top: -65px; /* Shifted up by 95px (Original 30px - 95px = -65px) */
      left: 20px;
      z-index: 10;
      pointer-events: none; 
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 11px; /* Smaller font size */
      font-weight: 600;
      letter-spacing: 1px;
      color: #000;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 16px; /* Smaller font size */
      line-height: 1.3;
      font-weight: 400;
      color: #1a1a1a;
      opacity: 0.9;
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: all 0.6s ease;
      filter: grayscale(100%) contrast(1.1); 
      overflow: hidden; /* Keep ripple effect contained */
    }

    .first-image {
      background-position: left center !important;
    }

    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.6s ease;
    }

    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1); 
    }

    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    .map-section {
      width: 100%;
      padding: 80px 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .map-title {
        margin-bottom: 20px;
        font-family: 'Exo', sans-serif;
        letter-spacing: 1px;
        font-size: 12px;
        text-transform: uppercase;
        color: #666;
    }

    #diaspora-map {
      width: 50vw; 
      height: 50vw; 
      max-height: 500px; 
      background-color: #e5e0d5; 
      border: 1px solid #dcd8ce;
    }

    @media (max-width: 768px) {
      .gallery-container {
        grid-template-columns: 1fr; 
        height: auto;
        margin-top: 80px;
      }
      .item-info {
        top: -45px;
      }
      .gallery-item {
        height: 300px; 
        margin-bottom: 60px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
      }
      #diaspora-map {
        width: 90vw; 
        height: 300px;
      }
    }
  </style>
</head>

<body>
  
  <main>
    
    <div class="gallery-container">
        
        <!-- Phase 01 -->
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-wrapper ripple-effect first-image" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
        </a>

        <!-- Phase 02 -->
        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1840s–1940s</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-wrapper ripple-effect" style="background-image: url('https://blog.lrei.org/asians-in-america/files/2019/05/railroad_workers.jpg.size-custom-crop.1086x0-1024x566.jpg');"></div>
        </a>

        <!-- Phase 03 -->
        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–1997</span>
                <span class="item-title">Reforms, Refugees, <br>and New Waves</span>
            </div>
            <div class="image-wrapper ripple-effect" style="background-image: url('https://images.unsplash.com/photo-1548505224-b58603632f81?q=80&w=1200&auto=format&fit=crop');"></div>
        </a>

        <!-- Phase 04 -->
        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 2000s–Present</span>
                <span class="item-title">Diversification and <br>Cultural Resilience</span>
            </div>
            <div class="image-wrapper ripple-effect" style="background-image: url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=1200&auto=format&fit=crop');"></div>
        </a>

    </div>

    <div class="map-section">
        <div class="map-title">Migration map</div>
        <div id="diaspora-map"></div>
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        try {
            $('.ripple-effect').ripples({
                resolution: 512,  
                dropRadius: 25,   
                perturbance: 0.04 
            });
        } catch (e) {
            console.log("Ripples effect failed to load.");
        }
    });
  </script>
</body>
</html>
