<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Header/Footer Injectors -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <!-- Mapbox CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>

  <!-- jQuery & Ripples -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

  <!-- External Mapbox Logic -->
  <script src="./assets/mapbox.js" defer></script>

  <style>
    :root {
      --bg: #f5f0e5; 
      --text: #1a1a1a;
      --header-h: 48px; 
      --mask-color: #e3bd28; 
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Gentium Book Plus', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      padding-top: var(--header-h);
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      width: 100vw;
      height: 65vh; 
      border-bottom: 1px solid #dcd8ce;
      margin-top: 100px;
    }

    .gallery-item {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
      border-right: 1px solid rgba(0,0,0,0.05);
      background-color: var(--bg);
      overflow: hidden;
    }

    .item-info {
      position: absolute;
      top: -65px;
      left: 20px;
      z-index: 50; 
      pointer-events: none; 
    }

    .item-number {
      display: block;
      font-family: 'Exo', sans-serif;
      font-size: 11px; 
      font-weight: 600;
      letter-spacing: 1px;
      color: #000;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .item-title {
      display: block;
      font-family: 'Gentium Book Plus', serif;
      font-size: 16px; 
      line-height: 1.3;
      font-weight: 400;
      color: #1a1a1a;
      opacity: 0.9;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(1.1); 
      transition: filter 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
      z-index: 10;
    }

    .first-image {
      background-position: left center !important;
    }

    .image-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--mask-color);
      mix-blend-mode: multiply; 
      opacity: 0.85; 
      transition: opacity 0.6s ease;
      z-index: 20;
      pointer-events: none;
    }

    /* Hover state */
    .gallery-item:hover .image-wrapper {
      filter: grayscale(0%) contrast(1); 
    }

    .gallery-item:hover .image-wrapper::after {
      opacity: 0; 
    }

    .map-section {
      width: 100%;
      padding: 80px 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .map-title {
        margin-bottom: 20px;
        font-family: 'Exo', sans-serif;
        letter-spacing: 1px;
        font-size: 12px;
        text-transform: uppercase;
        color: #666;
    }

    #diaspora-map {
      width: 50vw; 
      height: 50vw; 
      max-height: 500px; 
      border: 1px solid #dcd8ce;
    }

    @media (max-width: 768px) {
      .gallery-container {
        grid-template-columns: 1fr; 
        height: auto;
        margin-top: 80px;
      }
      .item-info {
        top: -45px;
      }
      .gallery-item {
        height: 300px; 
        margin-bottom: 60px;
      }
    }
  </style>
</head>

<body>
  
  <main>
    <div class="gallery-container">
        
        <a href="phase1.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">01. 17th–19th Centuries</span>
                <span class="item-title">Early Migration within <br>Southeast Asia</span>
            </div>
            <div class="image-wrapper first-image" style="background-image: url('https://www.historicvietnam.com/wp-content/uploads/2020/01/cropped-Cover-image-FRONT-b-1.jpg');"></div>
        </a>

        <a href="phase2.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">02. 1840s–1940s</span>
                <span class="item-title">Building North America <br>& The Pacific</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://newsarchive.berkeley.edu/news/media/releases/2005/04/images/china_train.jpg');"></div>
        </a>

        <a href="phase3.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">03. 1965–1997</span>
                <span class="item-title">Reforms, Refugees, <br>and New Waves</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Vietnamese_refugees_on_boat.jpg/1200px-Vietnamese_refugees_on_boat.jpg');"></div>
        </a>

        <a href="phase4.html" class="gallery-item">
            <div class="item-info">
                <span class="item-number">04. 1997–Present</span>
                <span class="item-title">Global Networks <br>& New Identities</span>
            </div>
            <div class="image-wrapper" style="background-image: url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=800');"></div>
        </a>

    </div>

    <section class="map-section">
        <h3 class="map-title">Cantonese Diaspora Map</h3>
        <div id="diaspora-map"></div>
    </section>
  </main>

  <script>
    $(document).ready(function() {
      // Check if WebGL is supported for ripples
      function isWebGLSupported() {
        try {
          var canvas = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && 
            (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
        } catch(e) {
          return false;
        }
      }

      if (isWebGLSupported()) {
        $('.image-wrapper').each(function() {
          var $wrapper = $(this);
          var bgImage = $wrapper.css('background-image');
          
          // Extract URL from background-image
          var urlMatch = bgImage.match(/url\(["']?([^"')]+)["']?\)/);
          if (urlMatch && urlMatch[1]) {
            try {
              // Initialize ripples with stronger settings
              $wrapper.ripples({
                resolution: 256,
                dropRadius: 25,
                perturbance: 0.06,
                interactive: false // We'll control it manually
              });
            } catch(e) {
              console.log('Ripples init error:', e);
            }
          }
        });

        // Variables for continuous ripple effect
        var rippleIntervals = {};

        $('.gallery-item').each(function(index) {
          var $item = $(this);
          var $wrapper = $item.find('.image-wrapper');

          $item.on('mouseenter', function(e) {
            // Create continuous ripple disturbance
            var width = $wrapper.width();
            var height = $wrapper.height();
            
            // Initial strong drop at mouse position
            var rect = $wrapper[0].getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            
            try {
              $wrapper.ripples('drop', x, y, 30, 0.1);
            } catch(err) {}

            // Continuous random drops for shake effect
            rippleIntervals[index] = setInterval(function() {
              var randX = Math.random() * width;
              var randY = Math.random() * height;
              var randRadius = 15 + Math.random() * 25;
              var randStrength = 0.03 + Math.random() * 0.05;
              
              try {
                $wrapper.ripples('drop', randX, randY, randRadius, randStrength);
              } catch(err) {}
            }, 80); // Drop every 80ms for continuous distortion

          }).on('mousemove', function(e) {
            // Add drops following mouse movement
            var rect = $wrapper[0].getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            
            try {
              $wrapper.ripples('drop', x, y, 20, 0.04);
            } catch(err) {}

          }).on('mouseleave', function() {
            // Stop continuous drops
            if (rippleIntervals[index]) {
              clearInterval(rippleIntervals[index]);
              rippleIntervals[index] = null;
            }
          });
        });
      }
    });
  </script>

</body>
</html>
