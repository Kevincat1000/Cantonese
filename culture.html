<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    /* Page wrapper */
    .page-wrapper {
      height: calc(100vh - var(--header-h));
      position: relative;
      background: #F5F0E5;
      overflow: hidden;
    }

    /* Stage */
    .culture-stage{
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Background image */
    .culture-bg{
      position:absolute;
      inset:0;
      background: url("images/culture-bg.jpg") center/cover no-repeat;
      filter: saturate(0.98);
    }

    .culture-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at 50% 65%,
        rgba(245,240,229,0) 0%,
        rgba(245,240,229,0.12) 45%,
        rgba(245,240,229,0.28) 100%);
      pointer-events:none;
    }

    /* Label */
    .symbol-hint{
      position:absolute;
      left:50%;
      top: 18%;
      transform: translateX(-50%);
      z-index:5;
    }

    .symbol-hint span{
      font: 600 12px/1 'Lato', system-ui, sans-serif;
      letter-spacing: .14em;
      color: rgba(0,0,0,0.55);
      text-transform: uppercase;
      background: rgba(245,240,229,0.75);
      padding: 10px 16px;
      border-radius: 999px;
    }

    /* Symbol row */
    .symbol-row{
      position:absolute;
      left:50%;
      top: 72%;                 /* 往下移一点 */
      transform: translateX(-50%);
      display:flex;
      gap: 36px;
      z-index:6;
    }

    /* Symbol button (no outer circle) */
    .symbol-btn{
      background: transparent;
      border: none;
      padding: 0;
      text-decoration: none;
      cursor: pointer;
    }

    /* Symbol image */
    .symbol-btn img{
      width: 84px;              /* 放大 1.5 倍 */
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform .2s ease;
    }

    .symbol-btn:hover img{
      transform: scale(1.08);
    }

    /* Mobile */
    @media (max-width: 640px){
      .symbol-row{
        gap: 22px;
        top: 74%;
      }
      .symbol-btn img{
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>

<body>
  <!-- header injected by header.js -->

  <div class="page-wrapper">
    <section class="culture-stage" aria-label="Culture Symbols">

      <div class="culture-bg" role="img" aria-label="Cantonese culture background"></div>

      <div class="symbol-hint">
        <span>Culture Symbols</span>
      </div>

      <div class="symbol-row">
        <a class="symbol-btn" href="symbol-1-faith.html" aria-label="Faith">
          <img src="images/icon-faith.png" alt="Faith">
        </a>

        <a class="symbol-btn" href="symbol-2-food.html" aria-label="Food">
          <img src="images/icon-food.png" alt="Food">
        </a>

        <a class="symbol-btn" href="symbol-3-opera.html" aria-label="Opera">
          <img src="images/icon-opera.png" alt="Opera">
        </a>

        <a class="symbol-btn" href="symbol-4-kungfu.html" aria-label="Kung Fu">
          <img src="images/icon-kungfu.png" alt="Kung Fu">
        </a>

        <a class="symbol-btn" href="symbol-5-lion.html" aria-label="Lion Dance">
          <img src="images/icon-lion.png" alt="Lion Dance">
        </a>
      </div>

    </section>
  </div>
</body>
</html>
