<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* lock window scroll; use .page-wrapper scroll */
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    .page-wrapper{
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      background: #F5F0E5;
    }

    /* ====== Symbol Hub Layout ====== */
    .symbol-hub{
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0; /* keep tight like reference */
    }

    .symbol-stage{
      position: relative;
      width: 100%;
      min-height: calc(100vh - var(--header-h));
      background: #e7e0d4;
      overflow: hidden;
    }

    /* Background image (like reference) */
    .stage-bg{
      position: absolute;
      inset: 0;
      background-image: url("images/symbols/bg-symbols.jpg"); /* TODO: replace */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: none;
      transform: scale(1.01);
    }

    /* Optional subtle overlay to help readability (no border) */
    .stage-tint{
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 55% 55%,
        rgba(0,0,0,0.00) 0%,
        rgba(0,0,0,0.08) 60%,
        rgba(0,0,0,0.12) 100%
      );
      pointer-events: none;
    }

    /* Main artwork image in the center */
    .stage-center{
      position: relative;
      z-index: 2;
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding-top: 6.5vh;
      display: flex;
      justify-content: center;
    }

    .center-art{
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      /* no border, no box-shadow (match your request) */
    }

    /* Bottom buttons row */
    .symbol-row{
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5vh;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 3vw, 36px);
      padding: 0 18px;
    }

    /* Button wrapper: no border */
    .symbol-btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(54px, 6vw, 74px);
      height: clamp(54px, 6vw, 74px);
      border-radius: 999px;
      text-decoration: none;
      outline: none;
      border: none;
      background: rgba(245,240,229,0.18);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .symbol-btn img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 999px;
      display: block;
    }

    .symbol-btn:hover{
      transform: translateY(-2px) scale(1.03);
      background: rgba(245,240,229,0.26);
    }

    .symbol-btn:focus-visible{
      box-shadow: 0 0 0 3px rgba(0,0,0,0.25);
    }

    /* Optional: label below icons on desktop only */
    .symbol-label{
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(5vh - 28px);
      z-index: 3;
      font: 600 13px/1.2 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: rgba(0,0,0,0.55);
      text-align: center;
      padding: 0 14px;
      display: none;
    }

    @media (min-width: 900px){
      .symbol-label{ display: block; }
    }

    /* Make sure content isn't hidden behind header on some injections */
    body{ background:#F5F0E5; }
  </style>
</head>

<body>
  <!-- header injected by ./assets/header.js -->

  <div class="page-wrapper">
    <div class="symbol-hub">
      <section class="symbol-stage" aria-label="Culture Symbols Hub">
        <div class="stage-bg" aria-hidden="true"></div>
        <div class="stage-tint" aria-hidden="true"></div>

        <div class="stage-center">
          <!-- TODO: replace with your “central initial image” -->
          <img class="center-art" src="images/symbols/center-initial.png" alt="Culture Symbols Overview Artwork">
        </div>

        <div class="symbol-label">
          Click a symbol to open its exhibit page.
        </div>

        <div class="symbol-row" role="navigation" aria-label="Symbols">
          <!-- TODO: replace icon images -->
          <a class="symbol-btn" href="symbol-1-faith.html" aria-label="Open Symbol 1: Religious Beliefs and Ancestral Worship">
            <img src="images/symbols/icon-1.png" alt="Symbol 1 icon">
          </a>

          <a class="symbol-btn" href="symbol-2-food.html" aria-label="Open Symbol 2: Culinary Heritage and the Global Table">
            <img src="images/symbols/icon-2.png" alt="Symbol 2 icon">
          </a>

          <a class="symbol-btn" href="symbol-3-opera.html" aria-label="Open Symbol 3: Cantonese Opera">
            <img src="images/symbols/icon-3.png" alt="Symbol 3 icon">
          </a>

          <a class="symbol-btn" href="symbol-4-kungfu.html" aria-label="Open Symbol 4: Martial Arts Cinema and Kung Fu">
            <img src="images/symbols/icon-4.png" alt="Symbol 4 icon">
          </a>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
