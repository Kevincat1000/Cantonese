<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }

    .content-inner {
      padding: 1.25rem 1rem 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 1024px) {
      .content-inner { padding: 1.5rem 2rem 3rem; }
    }

    /* =========================
       Symbols “hero” section
       ========================= */
    .symbols-stage {
      width: 100%;
      border: 1.25px solid rgba(0,0,0,0.9);
      border-radius: 18px;
      overflow: hidden;
      background: #F5F0E5;
    }

    .stage-bg {
      position: relative;
      width: 100%;
      height: clamp(320px, 42vw, 520px);
      background: #eae3d4;
      overflow: hidden;
    }

    .stage-bg img.bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      transform: scale(1.02);
    }

    /* Center “main” image (the one that switches) */
    .stage-main {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px 90px; /* leave room for buttons row */
      pointer-events: none;
    }

    .stage-main img#mainSymbolImage {
      width: min(72%, 720px);
      max-height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.25));
      transform: translateY(-6px);
    }

    /* Buttons row (foreground “people”) */
    .symbol-buttons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      justify-content: center;
      gap: clamp(10px, 2.2vw, 22px);
      padding: 0 14px;
      z-index: 5;
    }

    .symbol-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      gap: 8px;
      padding: 10px 10px 6px;
      border-radius: 14px;
      transition: transform 0.18s ease, background 0.18s ease, outline-color 0.18s ease;
      outline: 1.25px solid transparent;
    }

    .symbol-btn:hover { transform: translateY(-2px); background: rgba(245,240,229,0.55); }
    .symbol-btn.active { outline-color: rgba(0,0,0,0.9); background: rgba(245,240,229,0.72); }

    .symbol-btn img {
      width: clamp(56px, 7.2vw, 92px);
      height: clamp(56px, 7.2vw, 92px);
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.18));
    }

    .symbol-btn .btn-label {
      font: 700 12px/1.1 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.72);
    }

    /* =========================
       Text panel below
       ========================= */
    .symbol-text {
      padding: 18px 18px 20px;
      background: #F5F0E5;
    }
    @media (min-width: 900px){
      .symbol-text { padding: 22px 26px 26px; }
    }

    .symbol-h {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .symbol-title {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0;
    }

    .symbol-theme {
      font: 700 13px/1.35 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.62);
      margin: 0;
    }

    .symbol-body {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(0,0,0,0.86);
    }
    .symbol-body p { margin: 0 0 12px 0; }

    /* Small divider line */
    .symbol-divider {
      height: 1px;
      background: rgba(0,0,0,0.16);
      margin: 12px 0 14px;
    }
  </style>
</head>

<body>
  <!-- Header injected by ./assets/header.js -->

  <div class="page-wrapper">
    <div class="container">
      <div class="content-inner">

        <!-- =========================
             SYMBOLS SECTION
             ========================= -->
        <section class="symbols-stage" aria-label="Culture Symbols Interactive">
          <div class="stage-bg">
            <!-- Background image -->
            <img class="bg-img" src="images/symbols/bg.jpg" alt="Background artwork (replace with your image)">

            <!-- Center switching image -->
            <div class="stage-main" aria-hidden="true">
              <img id="mainSymbolImage" src="images/symbols/s1.png" alt="Selected symbol image">
            </div>

            <!-- Foreground “people buttons” -->
            <div class="symbol-buttons" role="tablist" aria-label="Select a symbol">
              <button class="symbol-btn active" type="button"
                data-key="s1"
                data-img="images/symbols/s1.png"
                aria-selected="true">
                <img src="images/symbols/btn1.png" alt="Symbol 1 button image">
                <div class="btn-label">Symbol 1</div>
              </button>

              <button class="symbol-btn" type="button"
                data-key="s2"
                data-img="images/symbols/s2.png"
                aria-selected="false">
                <img src="images/symbols/btn2.png" alt="Symbol 2 button image">
                <div class="btn-label">Symbol 2</div>
              </button>

              <button class="symbol-btn" type="button"
                data-key="s3"
                data-img="images/symbols/s3.png"
                aria-selected="false">
                <img src="images/symbols/btn3.png" alt="Symbol 3 button image">
                <div class="btn-label">Symbol 3</div>
              </button>

              <button class="symbol-btn" type="button"
                data-key="s4"
                data-img="images/symbols/s4.png"
                aria-selected="false">
                <img src="images/symbols/btn4.png" alt="Symbol 4 button image">
                <div class="btn-label">Symbol 4</div>
              </button>
            </div>
          </div>

          <!-- Text panel -->
          <div class="symbol-text" id="symbolText">
            <div class="symbol-h">
              <h2 class="symbol-title" id="symbolTitle"></h2>
              <p class="symbol-theme" id="symbolTheme"></p>
            </div>
            <div class="symbol-divider"></div>
            <div class="symbol-body" id="symbolBody"></div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script>
    // ====== DATA (your full text, no shortening) ======
    const SYMBOLS = {
      s1: {
        title: "Symbol 1: Religious Beliefs and Ancestral Worship",
        theme: "Theme: Spiritual Anchors and the \"Temple-Association\" Model",
        body: [
          "Guangdong immigrants transplanted their spiritual landscape to the U.S. through a unique \"Temple-Association\"  model. This integration of sacred and secular spaces—exemplified by the Tin How Temple in San Francisco (est. 1852)—served as a vital cultural nexus. Beyond worshiping Mazu or Guandi, these sites functioned as social hubs where ancestor worship reinforced lineage identity and community cohesion.",
          "By recreating familiar ritual spaces, early immigrants transformed traditional Lingnan folk beliefs into a visible public culture in the West. This \"regeneration\" allowed the community to maintain its cultural \"root\" while navigating the challenges of life in a foreign land, ultimately enriching America's multicultural religious landscape through festive performances like lion dances and opera."
        ]
      },
      s2: {
        title: "Symbol 2: Culinary Heritage and the Global Table",
        theme: "Theme: From Survival Strategy to Global Linguistic Influence",
        body: [
          "The evolution of Cantonese cuisine in the U.S. marks a remarkable journey from \"survival\" to \"cultural dominance.\" From only five restaurants in 1856 to over 50,000 today, the proliferation of Cantonese staples such as Chow Mein and Fried Rice provided immigrants with a critical economic foothold during the Exclusion Era.",
          "These dishes bridged the gap between Chinese kitchens and Western palates, becoming the foundation of the global \"Chinese takeout\" culture. More importantly, this dissemination led to the linguistic integration of Cantonese terms—not only \"Chow Mein\" but also \"Dim Sum\" and \"Won Ton\"—into the global lexicon. Yum Cha (dim sum) further evolved into a cross-cultural \"scene of public life,\" showcasing how Cantonese food culture \"regenerated\" from a marginalized community's sustenance into a ubiquitous symbol of cosmopolitan urban life."
        ]
      },
      s3: {
        title: "Symbol 3: Cantonese Opera",
        theme: "Theme: The Stage as a Repository of Transnational Memory",
        body: [
          "Cantonese Opera serves as a profound medium for cultural memory, manifesting Lingnan history through the \"stage\" in overseas diasporas. Historically, it functioned not just as entertainment, but as a ritualistic \"Chou-shen\" (thanksgiving to deities) performance that bonded immigrant communities.",
          "Its significance lies in its dual role: as a carrier of the Cantonese language and as a rigorous system of physical aesthetics. The opera’s tradition of acrobatics and stylized combat provided the foundational \"body knowledge\" for later action cinema. In the transnational context, Cantonese Opera became a mobile \"homeland,\" allowing immigrants to relive collective narratives and maintain their ethnic identity through the sight, sound, and symbolism of the traditional stage."
        ]
      },
      s4: {
        title: "Symbol 4: Martial Arts Cinema and \"Kung Fu\"",
        theme: "Theme: Industrialized Narratives and Linguistic Globalization",
        body: [
          "The global phenomenon of Kung Fu cinema is deeply rooted in the Lingnan martial arts and Cantonese Opera traditions. Hong Kong industrialized these local symbols—most notably the Wong Fei-hung legacy—to create a genre centered on \"South-style\" ethics and community order.",
          "The linguistic triumph of the word \"Kung Fu\" (a Cantonese transliteration) signifies the cultural binding of the Cantonese identity to global pop culture. From the 1970s \"Kung Fu Craze\" ignited by Bruce Lee to the Hollywood action choreography seen in The Matrix (designed by Yuen Woo-ping), Hong Kong cinema exported more than just films; it exported a \"body language.\" This regeneration through cinema transformed a local martial art into a universal symbol of resistance and discipline, permanently embedding Cantonese cultural elements into the global narrative."
        ]
      }
    };

    // ====== UI wiring ======
    const mainImg = document.getElementById('mainSymbolImage');
    const titleEl = document.getElementById('symbolTitle');
    const themeEl = document.getElementById('symbolTheme');
    const bodyEl  = document.getElementById('symbolBody');
    const buttons = Array.from(document.querySelectorAll('.symbol-btn'));

    function render(key){
      const d = SYMBOLS[key];
      if (!d) return;

      // swap image (center)
      const btn = buttons.find(b => b.dataset.key === key);
      const img = btn?.dataset.img;
      if (img) mainImg.src = img;

      // text
      titleEl.textContent = d.title;
      themeEl.textContent = d.theme;

      bodyEl.innerHTML = d.body.map(p => `<p>${p}</p>`).join('');
    }

    // init
    render('s1');

    buttons.forEach(b => {
      b.addEventListener('click', () => {
        const key = b.dataset.key;

        buttons.forEach(x => {
          x.classList.remove('active');
          x.setAttribute('aria-selected', 'false');
        });

        b.classList.add('active');
        b.setAttribute('aria-selected', 'true');

        render(key);

        // optional: ensure text is visible on click
        document.getElementById('symbolText').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  </script>
</body>
</html>
