<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in the Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    /* ✅ Fix header “shift” vs other pages: always reserve scrollbar space */
    html { overflow-y: scroll; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
      overflow: hidden; /* keep the page clean; we only reserve scrollbar on html */
    }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      position: relative;
    }

    /* Background image */
    .culture-bg {
      position: absolute;
      inset: 0;
      background: url("images/culture-bg.jpg") center / cover no-repeat;
      opacity: 0.95;
    }

    /* Symbol row */
    .culture-symbol-row {
      position: absolute;
      bottom: 7vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.2rem;
      align-items: center;
      z-index: 10;
    }

    .culture-symbol-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 240, 229, 0.92);
      backdrop-filter: blur(2px);
      text-decoration: none;

      /* ✅ Unified transition (all symbols same) */
      transition: transform 0.25s ease, background 0.25s ease;
      will-change: transform;
    }

    .culture-symbol-btn img {
      width: 64%;
      height: 64%;
      object-fit: contain;
      display: block;

      /* ✅ Unified transition (fix “lion feels different”) */
      transition: transform 0.25s ease, filter 0.25s ease;
      will-change: transform;
    }

    .culture-symbol-btn:hover {
      transform: translateY(-6px);
      background: rgba(245, 240, 229, 1);
    }

    .culture-symbol-btn:hover img {
      transform: scale(1.03); /* subtle, makes all icons feel consistent */
      filter: saturate(1.05);
    }

    .culture-symbol-btn:active {
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .culture-symbol-row {
        gap: 1.4rem;
        bottom: 6vh;
      }
      .culture-symbol-btn {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>

<body>
  <!-- Header injected by header.js -->

  <div class="page-wrapper">
    <div class="culture-bg"></div>

    <div class="culture-symbol-row">
      <a href="symbol-1-faith.html" class="culture-symbol-btn" aria-label="Religious Beliefs and Ancestral Worship">
        <img src="images/icon-faith.png" alt="Faith">
      </a>

      <a href="symbol-2-food.html" class="culture-symbol-btn" aria-label="Culinary Heritage">
        <img src="images/icon-food.png" alt="Food">
      </a>

      <a href="symbol-3-opera.html" class="culture-symbol-btn" aria-label="Cantonese Opera">
        <img src="images/icon-opera.png" alt="Opera">
      </a>

      <a href="symbol-4-kungfu.html" class="culture-symbol-btn" aria-label="Kung Fu Cinema">
        <img src="images/icon-kungfu.png" alt="Kung Fu">
      </a>

      <a href="symbol-5-lion.html" class="culture-symbol-btn" aria-label="Lion Dance">
        <img src="images/icon-liondance.png" alt="Lion Dance">
      </a>
    </div>
  </div>

</body>
</html>
