<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      position: relative;
      background: #F5F0E5;
    }

    /* ===== Stage ===== */
    .culture-stage{
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
    }

    .culture-bg{
      position: absolute;
      inset: 0;
      background: url("images/culture-bg.jpg") center / cover no-repeat;
    }

    /* subtle vignette */
    .culture-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 65%,
        rgba(245,240,229,0) 0%,
        rgba(245,240,229,0.15) 50%,
        rgba(245,240,229,0.35) 100%
      );
      pointer-events:none;
    }

    /* ===== Symbol row ===== */
    .symbol-row{
      position:absolute;
      left:50%;
      top: 74%;                 /* 往下移一点 */
      transform: translateX(-50%);
      display:flex;
      gap: 28px;                /* 紧凑但不挤 */
      z-index:6;
    }

    .symbol-btn{
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    /* === ICON 本体（放大后版本）=== */
    .symbol-btn img{
      width: 126px;
      height: 126px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform .2s ease;
    }

    .symbol-btn:hover img{
      transform: scale(1.05);
    }

    /* ===== Mobile ===== */
    @media (max-width: 640px){
      .symbol-row{
        top: 78%;
        gap: 18px;
      }
      .symbol-btn img{
        width: 84px;
        height: 84px;
      }
    }
  </style>
</head>

<body>
  <!-- header injected by ./assets/header.js -->

  <div class="page-wrapper">
    <section class="culture-stage" aria-label="Culture Symbols">
      <div class="culture-bg" role="img" aria-label="Cantonese cultural background"></div>

      <div class="symbol-row">
        <a class="symbol-btn" href="symbol-1-faith.html" aria-label="Faith">
          <img src="images/icon-faith.png" alt="Faith">
        </a>

        <a class="symbol-btn" href="symbol-2-food.html" aria-label="Food">
          <img src="images/icon-food.png" alt="Food">
        </a>

        <a class="symbol-btn" href="symbol-3-opera.html" aria-label="Opera">
          <img src="images/icon-opera.png" alt="Opera">
        </a>

        <a class="symbol-btn" href="symbol-4-kungfu.html" aria-label="Kung Fu">
          <img src="images/icon-kungfu.png" alt="Kung Fu">
        </a>

        <a class="symbol-btn" href="symbol-5-lion.html" aria-label="Lion Dance">
          <img src="images/icon-lion.png" alt="Lion Dance">
        </a>
      </div>
    </section>
  </div>
</body>
</html>
