<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    /* fade transition */
    body{ opacity:0; transition: opacity 260ms ease; }
    body.page-ready{ opacity:1; }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      scrollbar-gutter: stable;
      position: relative;
      background: #F5F0E5;
    }

    /* Full-bleed stage */
    .culture-stage{
      position: relative;
      height: 100%;
      width: 100%;
      background: #F5F0E5;
      overflow: hidden;
    }

    .culture-bg{
      position:absolute;
      inset:0;
      background:
        url("images/culture-bg.jpg") center/cover no-repeat;
      transform: scale(1.02);
      filter: saturate(0.98);
    }

    /* soft vignette, no borders */
    .culture-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at 50% 65%,
        rgba(245,240,229,0) 0%,
        rgba(245,240,229,0.12) 45%,
        rgba(245,240,229,0.28) 100%);
      pointer-events:none;
    }

    /* Bottom icon row */
    .symbol-row{
      position:absolute;
      left:0;
      right:0;
      bottom: 28px;
      display:flex;
      justify-content:center;
      gap: 22px;
      padding: 0 18px;
      z-index: 5;
    }

    .symbol-btn{
      width: 74px;
      height: 74px;
      border-radius: 999px;
      border: none;
      background: rgba(245,240,229,0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
      opacity: .92;
    }

    .symbol-btn:hover{
      transform: translateY(-2px) scale(1.02);
      background: rgba(245,240,229,0.82);
      opacity: 1;
    }

    .symbol-btn.active{
      outline: 2px solid rgba(0,0,0,0.55);
      outline-offset: 3px;
      opacity: 1;
    }

    .symbol-btn img{
      width: 56px;
      height: 56px;
      border-radius: 999px;
      object-fit: cover;
      display:block;
    }

    /* Small label above icons (optional, subtle) */
    .symbol-hint{
      position:absolute;
      left:0; right:0;
      bottom: 118px;
      display:flex;
      justify-content:center;
      z-index:5;
      pointer-events:none;
    }
    .symbol-hint span{
      font: 600 12px/1 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: .14em;
      color: rgba(0,0,0,0.55);
      text-transform: uppercase;
      background: rgba(245,240,229,0.55);
      padding: 8px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    @media (max-width: 560px){
      .symbol-btn{ width: 62px; height: 62px; }
      .symbol-btn img{ width: 48px; height: 48px; }
      .symbol-row{ gap: 14px; bottom: 18px; flex-wrap: wrap; }
      .symbol-hint{ bottom: 106px; }
    }
  </style>
</head>

<body>
  <!-- header injected by ./assets/header.js -->

  <div class="page-wrapper">
    <section class="culture-stage" aria-label="Culture Symbols">
      <div class="culture-bg" role="img" aria-label="Background image"></div>

      <div class="symbol-hint"><span>Culture Symbols</span></div>

      <div class="symbol-row">
        <a class="symbol-btn" href="symbol-1-faith.html" aria-label="Symbol 1: Religious Beliefs and Ancestral Worship">
          <img src="images/icon-faith.png" alt="Symbol 1 icon">
        </a>

        <a class="symbol-btn" href="symbol-2-food.html" aria-label="Symbol 2: Culinary Heritage and the Global Table">
          <img src="images/icon-food.png" alt="Symbol 2 icon">
        </a>

        <a class="symbol-btn" href="symbol-3-opera.html" aria-label="Symbol 3: Cantonese Opera">
          <img src="images/icon-opera.png" alt="Symbol 3 icon">
        </a>

        <a class="symbol-btn" href="symbol-4-kungfu.html" aria-label="Symbol 4: Martial Arts Cinema and Kung Fu">
          <img src="images/icon-kungfu.png" alt="Symbol 4 icon">
        </a>

        <!-- ✅ NEW: Symbol 5 (Lion Dance) -->
        <a class="symbol-btn" href="symbol-5-lion.html" aria-label="Symbol 5: Lion Dance">
          <img src="images/icon-liondance.png" alt="Symbol 5 icon">
        </a>
      </div>
    </section>
  </div>

  <script>
    // fade-in on load
    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('page-ready');
    });

    // fade-out on internal link click
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;

      const href = a.getAttribute('href') || '';
      const isSameTab = !a.target || a.target === '_self';
      const isHash = href.startsWith('#');
      const isExternal = /^https?:\/\//i.test(href);

      if (!href || isHash || isExternal || !isSameTab) return;

      e.preventDefault();
      document.body.classList.remove('page-ready');
      setTimeout(() => { window.location.href = href; }, 260);
    });
  </script>
</body>
</html>
