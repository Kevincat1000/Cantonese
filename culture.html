<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/style.css" />
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow: hidden;
    }

    /* ===== Stage ===== */
    .culture-stage{
      position: relative;
      height: 82vh;                 /* 🔑 不再吃满整屏 */
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .culture-bg{
      position:absolute;
      inset:0;
      background: url("images/culture-bg.jpg") center / cover no-repeat;
      transform: scale(0.97);       /* 🔑 收回溢出感 */
    }

    .culture-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 60%,
        rgba(245,240,229,0) 0%,
        rgba(245,240,229,0.12) 50%,
        rgba(245,240,229,0.28) 100%
      );
      pointer-events:none;
    }

    /* ===== Label ===== */
    .symbol-hint{
      position:absolute;
      left:0;
      right:0;
      top: 18%;
      display:flex;
      justify-content:center;
      z-index:5;
      pointer-events:none;
    }

    .symbol-hint span{
      font: 600 12px/1 'Lato', sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      background: rgba(245,240,229,0.65);
      padding: 12px 22px;
      border-radius: 999px;
      color: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    /* ===== Symbols ===== */
    .symbol-row{
      position:absolute;
      left:50%;
      top: 68%;                     /* 🔑 明显下移 */
      transform: translateX(-50%);
      display:flex;
      gap: 36px;                    /* 更紧凑 */
      z-index:6;
    }

    .symbol-btn{
      width: 140px;                 /* 🔑 缩小 */
      height: 140px;
      border-radius: 999px;
      background: rgba(245,240,229,0.78);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      transition: transform .2s ease, background .2s ease;
    }

    .symbol-btn:hover{
      transform: translateY(-6px) scale(1.03);
      background: rgba(245,240,229,0.92);
    }

    .symbol-btn img{
      width: 56px;                  /* 🔑 icon 缩小 */
      height: 56px;
      border-radius: 999px;
      object-fit: cover;
    }

    @media (max-width: 900px){
      .culture-stage{ height: 78vh; }
      .symbol-row{
        flex-wrap: wrap;
        top: 70%;
        gap: 20px;
      }
      .symbol-btn{
        width: 110px;
        height: 110px;
      }
      .symbol-btn img{
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <section class="culture-stage">
      <div class="culture-bg"></div>

      <div class="symbol-hint">
        <span>Culture Symbols</span>
      </div>

      <div class="symbol-row">
        <a class="symbol-btn" href="symbol-1-faith.html">
          <img src="images/icon-faith.png" alt="Faith">
        </a>
        <a class="symbol-btn" href="symbol-2-food.html">
          <img src="images/icon-food.png" alt="Food">
        </a>
        <a class="symbol-btn" href="symbol-3-opera.html">
          <img src="images/icon-opera.png" alt="Opera">
        </a>
        <a class="symbol-btn" href="symbol-4-kungfu.html">
          <img src="images/icon-kungfu.png" alt="Kung Fu">
        </a>
        <a class="symbol-btn" href="symbol-5-lion.html">
          <img src="images/icon-lion.png" alt="Lion Dance">
        </a>
      </div>
    </section>
  </div>
</body>
</html>
