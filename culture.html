<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />

  <!-- Header injector -->
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      position: relative;
      background: #F5F0E5;
    }

    /* ===== Full-bleed stage ===== */
    .culture-stage{
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .culture-bg{
      position:absolute;
      inset:0;
      background: url("images/culture-bg.jpg") center / cover no-repeat;
      filter: saturate(0.98);
    }

    .culture-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 60%,
        rgba(245,240,229,0) 0%,
        rgba(245,240,229,0.12) 42%,
        rgba(245,240,229,0.32) 100%
      );
      pointer-events:none;
    }

    /* ===== Symbol label ===== */
    .symbol-hint{
      position:absolute;
      left:0;
      right:0;
      top: 18%;
      display:flex;
      justify-content:center;
      z-index:5;
      pointer-events:none;
    }

    .symbol-hint span{
      font: 600 12px/1 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      background: rgba(245,240,229,0.55);
      padding: 10px 18px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* ===== Symbol row (FLOATING ON IMAGE) ===== */
    .symbol-row{
      position:absolute;
      left:50%;
      top: 62%;
      transform: translateX(-50%);
      display:flex;
      justify-content:center;
      gap: 40px;               /* wider spacing */
      padding: 0 24px;
      z-index: 6;
    }

    .symbol-btn{
      width: 120px;            /* 🔥 BIG */
      height: 120px;
      border-radius: 999px;
      background: rgba(245,240,229,0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      transition: transform .2s ease, background .2s ease;
    }

    .symbol-btn:hover{
      transform: translateY(-6px) scale(1.05);
      background: rgba(245,240,229,0.9);
    }

    .symbol-btn img{
      width: 84px;             /* 🔥 BIG icon */
      height: 84px;
      border-radius: 999px;
      object-fit: cover;
      display:block;
    }

    /* ===== Mobile ===== */
    @media (max-width: 768px){
      .symbol-row{
        top: 68%;
        gap: 20px;
      }
      .symbol-btn{
        width: 86px;
        height: 86px;
      }
      .symbol-btn img{
        width: 60px;
        height: 60px;
      }
    }

    @media (max-width: 480px){
      .symbol-row{
        flex-wrap: wrap;
        top: 66%;
        gap: 16px;
      }
    }
  </style>
</head>

<body>
  <!-- header injected -->

  <div class="page-wrapper">
    <section class="culture-stage" aria-label="Culture Symbols">
      <div class="culture-bg" aria-hidden="true"></div>

      <div class="symbol-hint">
        <span>Culture Symbols</span>
      </div>

      <div class="symbol-row">
        <a class="symbol-btn" href="symbol-1-faith.html" aria-label="Faith">
          <img src="images/icon-faith.png" alt="Faith icon">
        </a>

        <a class="symbol-btn" href="symbol-2-food.html" aria-label="Food">
          <img src="images/icon-food.png" alt="Food icon">
        </a>

        <a class="symbol-btn" href="symbol-3-opera.html" aria-label="Opera">
          <img src="images/icon-opera.png" alt="Opera icon">
        </a>

        <a class="symbol-btn" href="symbol-4-kungfu.html" aria-label="Kung Fu">
          <img src="images/icon-kungfu.png" alt="Kung Fu icon">
        </a>

        <a class="symbol-btn" href="symbol-5-lion.html" aria-label="Lion Dance">
          <img src="images/icon-lion.png" alt="Lion Dance icon">
        </a>
      </div>
    </section>
  </div>
</body>
</html>
