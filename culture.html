<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culture Symbols - Cantonese in Americas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Global style -->
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="./assets/header.js" defer></script>

  <style>
    :root { --header-h: 73px; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F5F0E5;
      font-family: 'Gentium Book Plus', serif;
    }

    .page-wrapper {
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      position: relative;
    }

    /* ===== Stage ===== */
    .culture-stage{
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .culture-bg{
      position:absolute;
      inset:0;
      background: url("images/culture-bg.jpg") center / cover no-repeat;
    }

    .culture-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 60%,
        rgba(245,240,229,0) 0%,
        rgba(245,240,229,0.15) 40%,
        rgba(245,240,229,0.35) 100%
      );
      pointer-events:none;
    }

    /* ===== Label ===== */
    .symbol-hint{
      position:absolute;
      left:0;
      right:0;
      top: 14%;
      display:flex;
      justify-content:center;
      z-index:5;
      pointer-events:none;
    }

    .symbol-hint span{
      font: 600 12px/1 'Lato', system-ui, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      background: rgba(245,240,229,0.6);
      padding: 12px 22px;
      border-radius: 999px;
      color: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    /* ===== SYMBOLS (×2 SIZE) ===== */
    .symbol-row{
      position:absolute;
      left:50%;
      top: 58%;                     /* 👈 视觉中心 */
      transform: translateX(-50%);
      display:flex;
      gap: 56px;                    /* wider spacing */
      z-index:6;
    }

    .symbol-btn{
      width: 180px;                 /* 🔥 ×2 */
      height: 180px;
      border-radius: 999px;
      background: rgba(245,240,229,0.72);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      cursor:pointer;
      transition: transform .22s ease, background .22s ease;
    }

    .symbol-btn:hover{
      transform: translateY(-10px) scale(1.06);
      background: rgba(245,240,229,0.92);
    }

    .symbol-btn img{
      width: 120px;                 /* 🔥 ×2 */
      height: 120px;
      border-radius: 999px;
      object-fit: cover;
    }

    /* ===== Mobile ===== */
    @media (max-width: 900px){
      .symbol-row{
        top: 64%;
        gap: 26px;
        flex-wrap: wrap;
        justify-content:center;
      }
      .symbol-btn{
        width: 120px;
        height: 120px;
      }
      .symbol-btn img{
        width: 78px;
        height: 78px;
      }
    }

    @media (max-width: 480px){
      .symbol-row{
        top: 66%;
      }
    }
  </style>
</head>

<body>
  <!-- header injected -->

  <div class="page-wrapper">
    <section class="culture-stage">
      <div class="culture-bg"></div>

      <div class="symbol-hint">
        <span>Culture Symbols</span>
      </div>

      <div class="symbol-row">
        <a class="symbol-btn" href="symbol-1-faith.html">
          <img src="images/icon-faith.png" alt="Faith">
        </a>
        <a class="symbol-btn" href="symbol-2-food.html">
          <img src="images/icon-food.png" alt="Food">
        </a>
        <a class="symbol-btn" href="symbol-3-opera.html">
          <img src="images/icon-opera.png" alt="Opera">
        </a>
        <a class="symbol-btn" href="symbol-4-kungfu.html">
          <img src="images/icon-kungfu.png" alt="Kung Fu">
        </a>
        <a class="symbol-btn" href="symbol-5-lion.html">
          <img src="images/icon-lion.png" alt="Lion Dance">
        </a>
      </div>
    </section>
  </div>
</body>
</html>
