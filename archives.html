<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese in Americas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f5f0e5;
      --accent-red: #c0392b; /* 红色字体颜色 */
      --text-black: #1a1a1a;
      --gap: 25px; /* 视频间隙 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-color);
      font-family: 'Exo', sans-serif;
      font-size: 13px;
      color: var(--text-black);
      line-height: 1.6;
    }

    main {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 40px;
    }

    /* 布局容器 */
    .split-layout {
      display: grid;
      grid-template-columns: 200px 1fr; /* 左边窄，右边宽 */
      column-gap: 50px;
      align-items: start;
    }

    /* 左侧标签区域 */
    .label-column {
      position: sticky;
      top: 40px;
    }

    .section-title {
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: block;
    }

    .black-text { color: var(--text-black); }
    .red-text { color: var(--accent-red); }

    /* 大括号包裹样式 */
    .bracket-group {
      display: flex;
      flex-direction: column;
      gap: 0; /* 这里由右侧视频的高度和间隙撑开 */
    }

    .bracket-item {
      height: 250px; /* 必须与视频高度+间隙对应，以保持水平对齐 */
      margin-bottom: var(--gap);
      display: flex;
      align-items: flex-start;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-red);
    }

    /* 右侧视频区域 */
    .video-column {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .video-wrapper {
      width: 100%;
      max-width: 600px; /* 控制视频窗口不要太大 */
      aspect-ratio: 16 / 9;
      background-color: #ddd; /* 占位色 */
      border: 1px solid rgba(0,0,0,0.1);
      position: relative;
    }

    /* 模拟视频播放器 */
    .video-wrapper iframe, 
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
    }

    /* 装饰线 */
    .divider {
      grid-column: 1 / -1;
      height: 1px;
      background: rgba(0,0,0,0.1);
      margin: 60px 0;
    }

    @media (max-width: 900px) {
      .split-layout { grid-template-columns: 1fr; }
      .bracket-item { height: auto; margin-bottom: 10px; }
      .video-wrapper { max-width: 100%; }
    }
  </style>
</head>
<body>

  <main>
    <!-- 第一部分：INTERVIEW FILES (5个视频) -->
    <div class="split-layout">
      <div class="label-column">
        <span class="section-title black-text">INTERVIEW<br>FILES</span>
        
        <div class="bracket-group">
          <div class="bracket-item">[ A ]</div>
          <div class="bracket-item">[ B·a ]</div>
          <div class="bracket-item">[ B·b ]</div>
          <div class="bracket-item">[ B·c ]</div>
          <div class="bracket-item">[ C ]</div>
        </div>
      </div>

      <div class="video-column">
        <!-- 视频 1-5 -->
        <div class="video-wrapper">
          <div class="placeholder-text">Video Link 1 (Coming Soon)</div>
          <!-- <iframe src="你的链接" frameborder="0" allowfullscreen></iframe> -->
        </div>
        <div class="video-wrapper"><div class="placeholder-text">Video Link 2</div></div>
        <div class="video-wrapper"><div class="placeholder-text">Video Link 3</div></div>
        <div class="video-wrapper"><div class="placeholder-text">Video Link 4</div></div>
        <div class="video-wrapper"><div class="placeholder-text">Video Link 5</div></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 第二部分：Cantonese Culture (2个视频) -->
    <div class="split-layout">
      <div class="label-column">
        <span class="section-title red-text">Cantonese<br>Culture</span>
        <div class="bracket-group">
          <div class="bracket-item">[ D ]</div>
          <div class="bracket-item">[ E ]</div>
        </div>
      </div>

      <div class="video-column">
        <!-- 视频 6-7 -->
        <div class="video-wrapper"><div class="placeholder-text">Video Link 6</div></div>
        <div class="video-wrapper"><div class="placeholder-text">Video Link 7</div></div>
      </div>
    </div>
  </main>

</body>
</html>
