<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese in Americas</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 原有注入脚本 -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg-color: #f5f0e5;
      --text-black: #000000;
      --accent-maroon: #701a1a;
      --header-h: 60px;
      --video-gap: 25px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      background-color: var(--bg-color);
      color: var(--text-black);
      font-family: 'Exo', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Header 隐藏逻辑修复 --- */
    #header-wrapper {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 2000;
      transition: top 0.4s ease-in-out;
      background-color: var(--bg-color); /* 确保背景不透明 */
    }
    .header-up { top: -100px !important; } /* 隐藏高度 */

    /* --- 布局核心 --- */
    main {
      width: 100%;
      flex: 1;
      padding-top: 80px; /* 留出header空间 */
      padding-bottom: 100px;
    }

    .row {
      display: flex;
      width: 100%;
      margin-bottom: var(--video-gap);
      align-items: flex-start;
    }

    .left-col {
      width: 50%;
      position: relative;
      height: 100%;
      min-height: 1px;
    }

    .right-col {
      width: 50%;
      padding-left: 40px; /* 视频离中线 40px */
    }

    /* 栏目标题：Exo 600, 14px, 黑色, 左边栏居中 */
    .section-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-black);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* 括号：Exo 400, 14px, #701a1a, 离中线 5px */
    .bracket-label {
      position: absolute;
      right: 5px;
      top: 0;
      font-size: 14px;
      font-weight: 400;
      color: var(--accent-maroon);
    }

    /* 视频缩略图 */
    .video-thumb {
      width: 50%;
      aspect-ratio: 16 / 9;
      background-color: #d1cdc4;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      transition: filter 0.3s;
      filter: grayscale(100%);
    }
    .video-thumb:hover { filter: grayscale(0%); }

    /* --- 弹窗 --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(245, 240, 229, 0.98);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      width: 70%; /* 缩小至70% */
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1);
    }

    .close-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      background: var(--accent-maroon);
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: none;
      font-size: 26px;
    }

    /* --- 手机端程序调整 --- */
    @media (max-width: 768px) {
      .row {
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
      }
      .left-col, .right-col {
        width: 100%;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: static; /* 取消绝对定位 */
      }
      .section-title {
        position: static;
        transform: none;
        margin-bottom: 15px;
        order: 1; /* 标题第一行 */
      }
      .bracket-label {
        position: static;
        margin-bottom: 10px;
        order: 2; /* 括号第二行 */
      }
      .video-thumb {
        width: 90%; /* 手机端视频稍微大一点方便点击 */
        order: 3; /* 视频第三行 */
      }
      /* 在手机端，后续行的标题需要隐藏，只留括号和视频 */
      .row:not(:first-of-type) .section-title {
        display: none;
      }
      /* 第二板块的标题逻辑同理 */
      #culture-section-start .section-title {
        display: block !important;
      }
    }

    html.preload body { opacity: 0; }
  </style>
</head>

<body>
  <div id="header-wrapper">
    <div id="header-injection-point"></div>
  </div>
  
  <div id="header-spacer" style="height: var(--header-h);" aria-hidden="true"></div>

  <main>
    
    <!-- INTERVIEW FILES SECTION -->
    <div class="row">
      <div class="left-col">
        <div class="section-title">INTERVIEW FILES</div>
        <div class="bracket-label">[ A ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_A"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ B ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_B"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ C ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_C"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ D ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_D"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ E ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_E"></div></div>
    </div>

    <div style="height: 80px;"></div>

    <!-- CULTURE RECORD SECTION -->
    <div class="row" id="culture-section-start">
      <div class="left-col">
        <div class="section-title">CULTURE RECORD</div>
        <div class="bracket-label">[ F ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_F"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ G ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_G"></div></div>
    </div>

  </main>

  <div id="footer-container"></div>

  <!-- 视频弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="modal-content">
      <iframe id="videoIframe" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // --- Header 滚动隐藏/显示逻辑修复 ---
    let lastScrollTop = 0;
    const headerWrapper = document.getElementById('header-wrapper');

    window.addEventListener('scroll', function() {
      let st = window.pageYOffset || document.documentElement.scrollTop;
      
      if (st > lastScrollTop && st > 100) {
        // 向下滚动 -> 隐藏
        headerWrapper.classList.add('header-up');
      } else {
        // 向上滚动 -> 显示
        headerWrapper.classList.remove('header-up');
      }
      lastScrollTop = st <= 0 ? 0 : st;
    }, false);

    // --- 弹窗逻辑 ---
    const overlay = document.getElementById('modalOverlay');
    const iframe = document.getElementById('videoIframe');
    const closeBtn = document.getElementById('closeBtn');
    const thumbs = document.querySelectorAll('.video-thumb');

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        iframe.src = thumb.getAttribute('data-video');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      iframe.src = ""; 
      document.body.style.overflow = 'auto';
    });

    // --- 同步高度逻辑 ---
    (function () {
      function sync() {
        const header = document.querySelector('header') || document.querySelector('.site-header');
        if (header) {
          const h = header.offsetHeight;
          document.documentElement.style.setProperty('--header-h', h + 'px');
          document.getElementById('header-spacer').style.height = h + 'px';
        }
      }
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(sync, 500);
        document.documentElement.classList.remove('preload');
      });
      window.addEventListener('resize', sync);
    })();
  </script>
</body>
</html>
