<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese in Americas</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- ✅ Gentium for A–G labels -->
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">

  <!-- 原有注入脚本 -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg-color: #f5f0e5;
      --text-black: #000000;
      --accent-maroon: #701a1a;
      --header-h: 60px;
      --video-gap: 25px;

      /* 标题在屏幕左侧约 20% */
      --title-x: 20vw;

      /* ✅ border thickness */
      --border-w: 2px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      background-color: var(--bg-color);
      color: var(--text-black);
      font-family: 'Exo', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ✅ Header 不固定：正常滚走 */
    #header-wrapper {
      position: static;
      width: 100%;
      background-color: var(--bg-color);
    }
    /* 覆盖 header.js 可能写的 fixed（不用 !important，用更高优先级） */
    #header-wrapper header,
    #header-wrapper .site-header {
      position: static;
      top: auto; left: auto; right: auto;
    }

    main {
      width: 100%;
      flex: 1;
      padding-top: 40px;
      padding-bottom: 100px;
    }

    .row {
      display: flex;
      width: 100%;
      margin-bottom: var(--video-gap);
      align-items: flex-start;
    }

    .left-col {
      width: 50%;
      position: relative;
      min-height: 1px;
    }

    .right-col {
      width: 50%;
      padding-left: 40px;
    }

    /* 左侧大标题：固定到左侧 20vw */
    .section-title {
      position: absolute;
      left: var(--title-x);
      transform: translateX(-50%);
      top: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-black);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ✅ A–G 括号标签：Gentium / 16 / 400 / 黑色 */
    .bracket-label {
      position: absolute;
      right: 5px;
      top: 0;
      font-family: "Gentium Book Plus", serif;
      font-size: 16px;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.2px;
    }

    /* ✅ B 行的文字说明（在 [ B ] 下面） */
    .item-meta {
      position: absolute;
      right: 5px;
      top: 26px;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.35;
      color: #000;
      font-weight: 400;
    }

    /* ✅ 左右缩略图边框：#701a1a + 加粗 */
    .video-thumb {
      width: 50%;
      aspect-ratio: 16 / 9;
      background-color: #d1cdc4;
      cursor: pointer;
      border: var(--border-w) solid var(--accent-maroon);
      transition: filter 0.3s;
      filter: grayscale(100%);
    }
    .video-thumb:hover { filter: grayscale(0%); }

    /* --- 弹窗 --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(245, 240, 229, 0.98);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      width: 70%;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1);
      border: var(--border-w) solid var(--accent-maroon);
    }

    /* ✅ 圆圈 X：#701a1a + 边框加粗 */
    .close-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: transparent;
      color: var(--accent-maroon);
      border: var(--border-w) solid var(--accent-maroon);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 28px;
      line-height: 1;
    }
    .close-btn:hover {
      background: rgba(112, 26, 26, 0.06);
    }

    /* --- 手机端 --- */
    @media (max-width: 768px) {
      :root { --title-x: 50vw; }

      .row {
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
      }

      .left-col, .right-col {
        width: 100%;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: static;
      }

      .section-title {
        position: static;
        transform: none;
        margin-bottom: 15px;
        order: 1;
      }

      .bracket-label {
        position: static;
        order: 2;
        margin-bottom: 6px;
      }

      .item-meta {
        position: static;
        order: 3;
        text-align: center;
        margin-bottom: 12px;
        max-width: 90%;
      }

      .video-thumb {
        width: 90%;
        order: 4;
      }

      .row:not(:first-of-type) .section-title {
        display: none;
      }
      #culture-section-start .section-title {
        display: block;
      }
    }

    html.preload body { opacity: 0; }
  </style>
</head>

<body>
  <div id="header-wrapper">
    <div id="header-injection-point"></div>
  </div>

  <main>

    <!-- INTERVIEW FILES SECTION -->
    <div class="row">
      <div class="left-col">
        <div class="section-title">INTERVIEW FILES</div>
        <div class="bracket-label">[ A ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_A"></div></div>
    </div>

    <div class="row">
      <div class="left-col">
        <div class="bracket-label">[ B ]</div>
        <!-- ✅ B 的文字信息 -->
        <div class="item-meta">Phoebe's Interview, 转行 2026 Jan 2, 转行 Los Angeles, California</div>
      </div>

      <!-- ✅ B Vimeo embed 链接（可直接 iframe 播放） -->
      <div class="right-col">
        <div class="video-thumb" data-video="https://player.vimeo.com/video/1151772755"></div>
      </div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ C ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_C"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ D ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_D"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ E ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_E"></div></div>
    </div>

    <div style="height: 80px;"></div>

    <!-- CULTURE RECORD SECTION -->
    <div class="row" id="culture-section-start">
      <div class="left-col">
        <div class="section-title">CULTURE RECORD</div>
        <div class="bracket-label">[ F ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_F"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ G ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_G"></div></div>
    </div>

  </main>

  <div id="footer-container"></div>

  <!-- 视频弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <button class="close-btn" id="closeBtn" aria-label="Close">×</button>
    <div class="modal-content">
      <iframe id="videoIframe" width="100%" height="100%" src=""
        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // --- 弹窗逻辑（顺手加 autoplay） ---
    const overlay = document.getElementById('modalOverlay');
    const iframe = document.getElementById('videoIframe');
    const closeBtn = document.getElementById('closeBtn');
    const thumbs = document.querySelectorAll('.video-thumb');

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        const raw = thumb.getAttribute('data-video');
        const src = raw + (raw.includes('?') ? '&' : '?') + 'autoplay=1';
        iframe.src = src;
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      iframe.src = "";
      document.body.style.overflow = 'auto';
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.documentElement.classList.remove('preload');
    });
  </script>
</body>
</html>
