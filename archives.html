<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese in Americas</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 原有注入脚本 -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg-color: #f5f0e5;
      --text-black: #000000;
      --accent-maroon: #701a1a; /* 要求的红色 */
      --header-h: 60px;
      --video-gap: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      background-color: var(--bg-color);
      color: var(--text-black);
      font-family: 'Exo', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- Header 隐藏逻辑 --- */
    #header-injection-point {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      transition: transform 0.4s ease; /* 顺滑切换 */
    }
    /* 滚动时隐藏类 */
    .header-hidden {
      transform: translateY(-100%);
    }

    /* --- 布局核心 --- */
    main {
      width: 100%;
      flex: 1;
      padding-top: 50px;
      padding-bottom: 100px;
    }

    .row {
      display: flex;
      width: 100%;
      margin-bottom: var(--video-gap);
      align-items: flex-start;
    }

    .left-col {
      width: 50%;
      position: relative;
    }

    .right-col {
      width: 50%;
      padding-left: 40px; /* 视频靠左边线 40px */
    }

    /* 栏目标题：14px, 600 weight, 黑色, 离左边 40px */
    .section-title {
      position: absolute;
      left: 40px;
      top: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* 括号：14px, 400 weight, #701a1a, 离中线 5px */
    .bracket-label {
      position: absolute;
      right: 5px;
      top: 0;
      font-size: 14px;
      font-weight: 400;
      color: var(--accent-maroon);
    }

    /* 视频缩略图 */
    .video-thumb {
      width: 50%;
      aspect-ratio: 16 / 9;
      background-color: #d1cdc4;
      cursor: pointer;
      position: relative;
      border: 1px solid rgba(0,0,0,0.05);
      transition: filter 0.3s;
      filter: grayscale(100%);
    }
    .video-thumb:hover { filter: grayscale(0%); }

    /* --- 视频弹窗 (Lightbox) --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(245, 240, 229, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      width: 70%; /* 缩小为原来的 70% */
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
    }

    .close-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      background: var(--accent-maroon); /* 要求的按钮颜色 */
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: none;
      font-size: 26px;
      z-index: 10000;
    }

    /* 防闪烁 */
    html.preload body { opacity: 0; }
    #header-spacer { height: var(--header-h); }
  </style>
</head>

<body>
  <div id="header-injection-point"></div>
  <div id="header-spacer" aria-hidden="true"></div>

  <main>
    
    <!-- 第一部分: INTERVIEW FILES -->
    <div class="row">
      <div class="left-col">
        <div class="section-title">INTERVIEW FILES</div>
        <div class="bracket-label">[ A ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_1"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ B ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_2"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ C ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_3"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ D ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_4"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ E ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_5"></div></div>
    </div>

    <div style="height: 60px;"></div>

    <!-- 第二部分: CULTURE RECORD -->
    <div class="row">
      <div class="left-col">
        <div class="section-title">CULTURE RECORD</div>
        <div class="bracket-label">[ F ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_6"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ G ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_7"></div></div>
    </div>

  </main>

  <div id="footer-container"></div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="modal-content">
      <iframe id="videoIframe" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // --- 弹窗逻辑 ---
    const overlay = document.getElementById('modalOverlay');
    const iframe = document.getElementById('videoIframe');
    const closeBtn = document.getElementById('closeBtn');
    const thumbs = document.querySelectorAll('.video-thumb');

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        const url = thumb.getAttribute('data-video');
        iframe.src = url; 
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      iframe.src = ""; 
      document.body.style.overflow = 'auto';
    });

    // --- Header 滚动显示/隐藏逻辑 ---
    let lastScrollY = window.scrollY;
    const headerEl = document.getElementById('header-injection-point');

    window.addEventListener('scroll', () => {
      if (window.scrollY > lastScrollY && window.scrollY > 100) {
        // 向下滚 - 隐藏
        headerEl.classList.add('header-hidden');
      } else {
        // 向上滚 - 显示
        headerEl.classList.remove('header-hidden');
      }
      lastScrollY = window.scrollY;
    });

    // --- 原有 Header/Footer 同步逻辑 ---
    (function () {
      const spacer = document.getElementById('header-spacer');
      function findHeaderEl() { return document.querySelector('header') || document.querySelector('.site-header'); }
      function syncHeaderHeight() {
        const header = findHeaderEl();
        if (!header) return false;
        const h = Math.ceil(header.getBoundingClientRect().height);
        if (h > 0) {
          document.documentElement.style.setProperty('--header-h', h + 'px');
          if (spacer) spacer.style.height = h + 'px';
          return true;
        }
        return false;
      }
      function showPage() { document.documentElement.classList.remove('preload'); }

      document.addEventListener('DOMContentLoaded', () => {
        let tries = 0;
        (function tick() {
          tries++;
          if (syncHeaderHeight()) { showPage(); return; }
          if (tries > 80) { showPage(); return; }
          requestAnimationFrame(tick);
        })();
        window.addEventListener('resize', syncHeaderHeight);
      });
    })();
  </script>
</body>
</html>
