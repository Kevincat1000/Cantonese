<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese in Americas</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 原有注入脚本 -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg-color: #f5f0e5;
      --text-black: #000000;
      --accent-green: #3c6d3c;
      --header-h: 60px;
      --video-gap: 25px;

      /* ✅ 标题在屏幕左侧约 20% 的位置（桌面端） */
      --title-x: 20vw;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      background-color: var(--bg-color);
      color: var(--text-black);
      font-family: 'Exo', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ✅ 2) Header 不再固定：让它跟随页面自然滚动 */
    #header-wrapper {
      position: static;
      width: 100%;
      z-index: auto;
      background-color: var(--bg-color);
    }

    /* 如果 header.js 里给 header / .site-header 写了定位，这里提高选择器优先级覆盖它（不使用 important） */
    #header-wrapper header,
    #header-wrapper .site-header {
      position: static;
      top: auto;
      left: auto;
      right: auto;
    }

    /* --- 布局核心 --- */
    main {
      width: 100%;
      flex: 1;
      padding-top: 40px;   /* ✅ 现在不需要为 fixed header 让位了 */
      padding-bottom: 100px;
    }

    .row {
      display: flex;
      width: 100%;
      margin-bottom: var(--video-gap);
      align-items: flex-start;
    }

    .left-col {
      width: 50%;
      position: relative;
      height: 100%;
      min-height: 1px;
    }

    .right-col {
      width: 50%;
      padding-left: 40px; /* 视频离中线 40px */
    }

    /* ✅ 1) 左侧标题“离左边屏幕约 20%”对齐显示 */
    .section-title {
      position: absolute;
      left: var(--title-x);
      transform: translateX(-50%);
      top: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-black);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none; /* 避免遮挡点击区域（安全处理） */
    }

    /* ✅ 3) 括号/字母颜色改为 #3c6d3c */
    .bracket-label {
      position: absolute;
      right: 5px;
      top: 0;
      font-size: 14px;
      font-weight: 400;
      color: var(--accent-green);
    }

    /* 视频缩略图 */
    .video-thumb {
      width: 50%;
      aspect-ratio: 16 / 9;
      background-color: #d1cdc4;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      transition: filter 0.3s;
      filter: grayscale(100%);
    }
    .video-thumb:hover { filter: grayscale(0%); }

    /* --- 弹窗 --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(245, 240, 229, 0.98);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      width: 70%; /* 缩小至70% */
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1);
    }

    .close-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      background: var(--accent-green); /* 顺手统一一下关闭按钮颜色（可删） */
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: none;
      font-size: 26px;
    }

    /* --- 手机端程序调整 --- */
    @media (max-width: 768px) {
      :root { --title-x: 50vw; } /* 手机端标题居中更自然（你也可以删掉这一行） */

      .row {
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
      }
      .left-col, .right-col {
        width: 100%;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: static; /* 取消绝对定位 */
      }
      .section-title {
        position: static;
        transform: none;
        margin-bottom: 15px;
        order: 1; /* 标题第一行 */
      }
      .bracket-label {
        position: static;
        margin-bottom: 10px;
        order: 2; /* 括号第二行 */
      }
      .video-thumb {
        width: 90%; /* 手机端视频稍微大一点方便点击 */
        order: 3; /* 视频第三行 */
      }
      /* 在手机端，后续行的标题需要隐藏，只留括号和视频 */
      .row:not(:first-of-type) .section-title {
        display: none;
      }
      /* 第二板块的标题逻辑同理 */
      #culture-section-start .section-title {
        display: block;
      }
    }

    html.preload body { opacity: 0; }
  </style>
</head>

<body>
  <div id="header-wrapper">
    <div id="header-injection-point"></div>
  </div>

  <main>
    <!-- INTERVIEW FILES SECTION -->
    <div class="row">
      <div class="left-col">
        <div class="section-title">INTERVIEW FILES</div>
        <div class="bracket-label">[ A ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_A"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ B ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_B"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ C ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_C"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ D ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_D"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ E ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_E"></div></div>
    </div>

    <div style="height: 80px;"></div>

    <!-- CULTURE RECORD SECTION -->
    <div class="row" id="culture-section-start">
      <div class="left-col">
        <div class="section-title">CULTURE RECORD</div>
        <div class="bracket-label">[ F ]</div>
      </div>
      <div class="right-col"><div class="video-thumb" data-video="URL_F"></div></div>
    </div>

    <div class="row">
      <div class="left-col"><div class="bracket-label">[ G ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_G"></div></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <!-- 视频弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="modal-content">
      <iframe id="videoIframe" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // --- 弹窗逻辑 ---
    const overlay = document.getElementById('modalOverlay');
    const iframe = document.getElementById('videoIframe');
    const closeBtn = document.getElementById('closeBtn');
    const thumbs = document.querySelectorAll('.video-thumb');

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        iframe.src = thumb.getAttribute('data-video');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      iframe.src = "";
      document.body.style.overflow = 'auto';
    });

    // --- preload 去闪动 ---
    document.addEventListener('DOMContentLoaded', () => {
      document.documentElement.classList.remove('preload');
    });
  </script>
</body>
</html>
