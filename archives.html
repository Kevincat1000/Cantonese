<!DOCTYPE html>
<html lang="en" class="preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantonese in Americas</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 原有调用脚本 -->
  <script src="./assets/header.js" defer></script>
  <script src="./assets/footer.js" defer></script>

  <style>
    :root {
      --bg-color: #f5f0e5;
      --text-color: #000000;
      --accent-red: #c0392b;
      --header-h: 60px;
      --video-gap: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Exo', sans-serif;
      font-size: 11px; /* 调小字体以符合附件风格 */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- 布局核心 --- */
    main {
      width: 100%;
      flex: 1;
      padding-top: 50px;
      padding-bottom: 100px;
    }

    /* 每一行：左50% 右50% */
    .row {
      display: flex;
      width: 100%;
      margin-bottom: var(--video-gap);
      align-items: flex-start; /* 确保所有标签与视频顶部对齐 */
    }

    .left-col {
      width: 50%;
      position: relative;
      height: 100%;
    }

    .right-col {
      width: 50%;
      padding-left: 40px; /* 视频距离中线 40px */
    }

    /* 栏目标题：距离屏幕左边 40px */
    .section-title {
      position: absolute;
      left: 40px;
      top: 0;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* 大括号：距离中线 5px */
    .bracket-label {
      position: absolute;
      right: 5px;
      top: 0;
      color: var(--accent-red);
      font-weight: 600;
      font-size: 13px;
    }

    /* 视频缩略图 */
    .video-thumb {
      width: 50%; /* 视频宽度为右栏的一半 */
      aspect-ratio: 16 / 9;
      background-color: #e0e0e0;
      cursor: pointer;
      position: relative;
      border: 1px solid rgba(0,0,0,0.05);
      transition: opacity 0.3s;
      /* 模拟附件中的灰度质感 */
      filter: grayscale(100%) contrast(0.9);
    }
    .video-thumb:hover { filter: grayscale(0%); opacity: 0.9; }

    /* 栏目颜色 */
    .black-text { color: #000; }
    .red-text { color: var(--accent-red); }

    /* --- 弹窗 (Modal) --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(245, 240, 229, 0.98); /* 使用背景色作为遮罩，更有高级感 */
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      width: 85%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      background: #000;
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: none;
      font-size: 24px;
      z-index: 10000;
      transition: transform 0.2s;
    }
    .close-btn:hover { transform: scale(1.1); }

    /* 防闪烁 */
    html.preload body { opacity: 0; }
    #header-spacer { height: var(--header-h); }
  </style>
</head>

<body>
  <div id="header-injection-point"></div>
  <div id="header-spacer" aria-hidden="true"></div>

  <main>
    
    <!-- INTERVIEW FILES 部分 (1-5) -->
    <!-- 第一个视频，带栏目标题 -->
    <div class="row">
      <div class="left-col">
        <div class="section-title black-text">INTERVIEW FILES</div>
        <div class="bracket-label">[ A ]</div>
      </div>
      <div class="right-col">
        <div class="video-thumb" data-video="URL_1"></div>
      </div>
    </div>

    <!-- 视频 2-5 -->
    <div class="row">
      <div class="left-col"><div class="bracket-label">[ B · a ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_2"></div></div>
    </div>
    <div class="row">
      <div class="left-col"><div class="bracket-label">[ B · b ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_3"></div></div>
    </div>
    <div class="row">
      <div class="left-col"><div class="bracket-label">[ B · c ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_4"></div></div>
    </div>
    <div class="row">
      <div class="left-col"><div class="bracket-label">[ C ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_5"></div></div>
    </div>

    <div style="height: 60px;"></div> <!-- 两个板块之间的额外间距 -->

    <!-- Cantonese Culture 部分 (6-7) -->
    <!-- 第六个视频，带红色栏目标题 -->
    <div class="row">
      <div class="left-col">
        <div class="section-title red-text">Cantonese Culture</div>
        <div class="bracket-label">[ D ]</div>
      </div>
      <div class="right-col">
        <div class="video-thumb" data-video="URL_6"></div>
      </div>
    </div>

    <!-- 第七个视频 -->
    <div class="row">
      <div class="left-col"><div class="bracket-label">[ E ]</div></div>
      <div class="right-col"><div class="video-thumb" data-video="URL_7"></div></div>
    </div>

  </main>

  <div id="footer-container"></div>

  <!-- 视频弹窗结构 -->
  <div class="modal-overlay" id="modalOverlay">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="modal-content">
      <iframe id="videoIframe" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // --- 弹窗逻辑 ---
    const overlay = document.getElementById('modalOverlay');
    const iframe = document.getElementById('videoIframe');
    const closeBtn = document.getElementById('closeBtn');
    const thumbs = document.querySelectorAll('.video-thumb');

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        const videoUrl = thumb.getAttribute('data-video');
        // 提示：如果是YouTube链接，请使用 /embed/ 格式
        iframe.src = videoUrl; 
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden'; // 禁止背景滚动
      });
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      iframe.src = ""; 
      document.body.style.overflow = 'auto';
    });

    // --- Header/Footer 同步逻辑 ---
    (function () {
      const spacer = document.getElementById('header-spacer');
      function findHeaderEl() { return document.querySelector('header') || document.querySelector('.site-header'); }
      function syncHeaderHeight() {
        const header = findHeaderEl();
        if (!header) return false;
        const h = Math.ceil(header.getBoundingClientRect().height);
        if (h > 0) {
          document.documentElement.style.setProperty('--header-h', h + 'px');
          if (spacer) spacer.style.height = h + 'px';
          return true;
        }
        return false;
      }
      function showPage() { document.documentElement.classList.remove('preload'); }

      document.addEventListener('DOMContentLoaded', () => {
        let tries = 0;
        (function tick() {
          tries++;
          if (syncHeaderHeight()) { showPage(); return; }
          if (tries > 80) { showPage(); return; }
          requestAnimationFrame(tick);
        })();
        window.addEventListener('resize', syncHeaderHeight);
      });
    })();
  </script>
</body>
</html>
